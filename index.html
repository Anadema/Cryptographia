<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#050510">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Cryptographia ▸ Cyberpunk Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <style>
    *{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;box-sizing:border-box}
    input{-webkit-user-select:text;user-select:text;font-size:16px}
    body{font-family:'Rajdhani',sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none;background:#050510;color:#e0e0f0;margin:0;min-height:100vh}
    .ft{font-family:'Orbitron',sans-serif;letter-spacing:.08em}
    .fm{font-family:'Share Tech Mono',monospace}
    .ns{user-select:none;-webkit-user-select:none}

    /* === NEON GLOW EFFECTS === */
    .glow-cyan{text-shadow:0 0 7px #00f0ff,0 0 20px #00f0ff40,0 0 40px #00f0ff20}
    .glow-pink{text-shadow:0 0 7px #ff2d95,0 0 20px #ff2d9540}
    .glow-green{text-shadow:0 0 7px #00ff41,0 0 20px #00ff4140}
    .glow-gold{text-shadow:0 0 7px #ffd700,0 0 20px #ffd70040}
    .border-glow-cyan{box-shadow:0 0 8px #00f0ff40,inset 0 0 8px #00f0ff10}
    .border-glow-pink{box-shadow:0 0 8px #ff2d9540,inset 0 0 8px #ff2d9510}
    .border-glow-green{box-shadow:0 0 12px #00ff4160,inset 0 0 8px #00ff4115}
    .border-glow-gold{box-shadow:0 0 12px #ffd70060,inset 0 0 8px #ffd70015}

    /* === GLASSMORPHISM CARDS === */
    .glass{background:rgba(10,10,30,.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(0,240,255,.15)}
    .glass2{background:rgba(15,15,40,.8);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,45,149,.15)}

    /* === BACKGROUND WALLPAPER === */
    .bg-cyber{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
    .bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,240,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,.03) 1px,transparent 1px);background-size:40px 40px}
    .bg-radial{position:absolute;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(0,240,255,.06) 0%,transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(255,45,149,.04) 0%,transparent 50%),radial-gradient(ellipse at 50% 80%,rgba(0,255,65,.03) 0%,transparent 50%)}

    /* === FLOATING SYMBOLS === */
    @keyframes float{0%{transform:translateY(100vh) rotate(0deg);opacity:0}10%{opacity:.06}90%{opacity:.06}100%{transform:translateY(-100px) rotate(360deg);opacity:0}}
    .sym{position:absolute;font-size:1.8rem;color:#00f0ff;opacity:0;animation:float linear infinite;pointer-events:none}

    /* === SCANLINES === */
    .scanlines::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.08) 2px,rgba(0,0,0,.08) 4px);pointer-events:none;z-index:9999}

    /* === GLITCH TITLE === */
    @keyframes glitch1{0%,100%{clip-path:inset(0 0 96% 0)}25%{clip-path:inset(40% 0 30% 0)}50%{clip-path:inset(80% 0 5% 0)}75%{clip-path:inset(10% 0 60% 0)}}
    @keyframes glitch2{0%,100%{clip-path:inset(96% 0 0 0)}25%{clip-path:inset(20% 0 50% 0)}50%{clip-path:inset(5% 0 80% 0)}75%{clip-path:inset(60% 0 10% 0)}}

    /* === ANIMATIONS === */
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
    .shake{animation:shake .3s ease-in-out}
    @keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .fi{animation:fadeIn .5s ease-out}
    @keyframes sealReveal{0%{transform:scale(0) rotate(-180deg);opacity:0}60%{transform:scale(1.15) rotate(10deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
    .sr{animation:sealReveal .8s cubic-bezier(.34,1.56,.64,1) forwards}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    .pulse{animation:pulse 2s ease-in-out infinite}
    @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
    .neon-shimmer{background:linear-gradient(90deg,#00f0ff,#ff2d95,#00ff41,#ffd700,#00f0ff);background-size:200% 100%;animation:shimmer 3s linear infinite;-webkit-background-clip:text;background-clip:text;color:transparent}
    @keyframes borderPulse{0%,100%{border-color:rgba(0,240,255,.3)}50%{border-color:rgba(0,240,255,.8)}}
    .border-pulse{animation:borderPulse 2s ease-in-out infinite}

    .hex{font-family:'Share Tech Mono',monospace;font-size:.7em;line-height:1.5;background:#0a0a0a;color:#33ff33;padding:12px;border-radius:6px;overflow-x:auto;max-height:240px;overflow-y:auto;white-space:pre;word-break:break-all}
  </style>
</head>
<body class="scanlines">

<!-- BACKGROUND -->
<div class="bg-cyber" id="bgSymbols">
  <div class="bg-grid"></div>
  <div class="bg-radial"></div>
</div>

<div id="root" style="position:relative;z-index:1"></div>

<script>
// Generate floating symbols
const symbols='𓂀♜⊞⚜⚡♛⚙◉αβγδ01···---'.split('');
const bg=document.getElementById('bgSymbols');
for(let i=0;i<25;i++){
  const s=document.createElement('div');
  s.className='sym';
  s.textContent=symbols[i%symbols.length];
  s.style.left=Math.random()*100+'%';
  s.style.animationDuration=(15+Math.random()*25)+'s';
  s.style.animationDelay=(Math.random()*20)+'s';
  s.style.fontSize=(1+Math.random()*2)+'rem';
  s.style.color=['#00f0ff','#ff2d95','#00ff41','#ffd700'][Math.floor(Math.random()*4)];
  bg.appendChild(s);
}
</script>

<script type="text/babel" data-presets="react">
const{useState,useMemo,useEffect}=React;
const norm=s=>{if(typeof s!=='string')return'';return s.toUpperCase().replace(/[^A-Z0-9]/g,'').trim().slice(0,50)};
const san=s=>{if(typeof s!=='string')return'';return s.replace(/[<>"'`\\]/g,'').slice(0,30)};

const Ic=({n,s=20,c=''})=>{const p={
  cr:<polyline points="9 18 15 12 9 6" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>,
  cl:<polyline points="15 18 9 12 15 6" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>,
  ck:<polyline points="20 6 9 17 4 12" stroke="currentColor" strokeWidth="3" fill="none" strokeLinecap="round" strokeLinejoin="round"/>,
  tp:<g stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></g>,
  ul:<g stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></g>,
};return <svg width={s} height={s} viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" className={c}>{p[n]}</svg>};

const ROM=['I','II','III','IV','V','VI','VII','VIII'];

const CH=[
  {id:1,ep:'−500',nm:'La Scytale',cv:'Sparte',ic:'𓂀',ans:'LEONIDAS',fl:'LACEDEMONE',fm:"L'antique nom de Sparte.",hi:"Les généraux spartiates enroulaient une bande de cuir autour d'un bâton appelé scytale.",clr:'#00f0ff',
    mini:'🛡️',
    lore:"Au Ve siècle avant J.-C., Sparte dominait le Péloponnèse par la force de ses guerriers. Les éphores — magistrats suprêmes — devaient communiquer secrètement avec leurs généraux déployés au loin.\n\nIls inventèrent la scytale : une bande de cuir étroite enroulée en spirale autour d'un bâton cylindrique à section carrée parfaite. Le message s'écrivait horizontalement, puis la bande était déroulée pour être confiée au messager. Sans le bon bâton, impossible de lire quoi que ce soit.\n\nLe plus célèbre utilisateur de la scytale fut sans doute un roi spartiate légendaire, héros des Thermopyles, qui mena 300 guerriers face à l'Empire perse en 480 av. J.-C. Les messages chiffrés par scytale jouèrent un rôle crucial dans la coordination des forces grecques.\n\nLe nombre de faces visibles du bâton déterminait le chiffrement. Pour reconstituer le message, il fallait enrouler la bande sur un bâton identique et lire horizontalement."},
  {id:2,ep:'−50',nm:'Le Chiffre de César',cv:'Rome',ic:'♜',ans:'VENIVIDIVICI',fl:'RUBICON',fm:"Le fleuve franchi par César.",hi:"César décalait chaque lettre selon une clé secrète.",clr:'#ff2d95',
    mini:'🏛️',
    lore:"Jules César, consul puis dictateur de Rome, utilisait un système de chiffrement d'une simplicité trompeuse. Chaque lettre de l'alphabet était remplacée par celle située quelques positions plus loin — un décalage si modeste qu'on pouvait le compter sur les doigts d'une main.\n\nSuétone rapporte que César l'utilisait pour sa correspondance privée. À une époque où la majorité de la population était illettrée, ce simple décalage suffisait à protéger les messages les plus sensibles.\n\nLes Romains notaient leurs nombres avec des lettres : I, V, X, L, C, D, M. Le décalage de César est souvent exprimé dans cette notation ancestrale.\n\nAprès sa conquête de la Gaule, César envoya au Sénat un message devenu légendaire — une phrase de victoire en trois mots latins, si concise et percutante qu'elle traversa les siècles. Quelques années plus tôt, il avait franchi un fleuve fameux, déclenchant la guerre civile qui transforma la République en Empire."},
  {id:3,ep:'−150',nm:'Le Carré de Polybe',cv:'Grèce',ic:'⊞',ans:'SECRET',fl:'TORCHES',fm:"Deux groupes de torches transmettaient les coordonnées.",hi:"Polybe inventa une grille 5×5 où chaque lettre est repérée par deux chiffres.",clr:'#00ff41',
    mini:'🔥',
    lore:"Polybe, historien grec du IIe siècle av. J.-C., inventa un système de communication à distance remarquable. Il disposa les 25 lettres de l'alphabet dans une grille carrée, où chaque lettre est identifiée par sa position : un premier chiffre pour la ligne, un second pour la colonne.\n\nPour transmettre à distance, Polybe utilisait des torches allumées sur les collines : un premier groupe indiquait la rangée, un second la colonne. Ce système permettait de communiquer la nuit sur de grandes distances, à une vitesse surprenante pour l'époque.\n\nDes siècles plus tard, les prisonniers de guerre adaptèrent cette méthode en tapant sur les murs de leurs cellules — le fameux « code des prisonniers ». Un prisonnier tapait d'abord le numéro de ligne, puis celui de colonne, pour chaque lettre du message.\n\nLa grille de Polybe est aussi à la base de nombreux chiffrements modernes. Sa simplicité est sa force : il suffit de connaître les coordonnées pour déchiffrer n'importe quel message."},
  {id:4,ep:'1586',nm:'Le Chiffre de Vigenère',cv:'France',ic:'⚜',ans:'TROIS',fl:'INDECHIFFRABLE',fm:"Son surnom pendant trois siècles.",hi:"Une clé secrète décale différemment chaque lettre.",clr:'#ffd700',
    mini:'📜',
    lore:"Blaise de Vigenère, diplomate français à la cour d'Henri III, perfectionna en 1586 un système polyalphabétique. Contrairement au chiffre de César (décalage fixe), Vigenère utilise une clé secrète qui modifie chaque lettre différemment.\n\nLa clé est un mot court et mémorable — souvent un mot de quatre lettres évoquant la puissance ou la noblesse. On raconte que les diplomates français choisissaient des noms d'animaux majestueux, emblèmes du pouvoir royal. Cette clé se répète cycliquement sur toute la longueur du message.\n\nPour chiffrer, on additionne chaque lettre du texte avec la lettre correspondante de la clé (A=0, B=1...). Pour déchiffrer, on soustrait.\n\nPendant 300 ans, ce chiffre fut surnommé « le chiffre indéchiffrable ». Il fallut attendre le XIXe siècle pour que Charles Babbage et Friedrich Kasiski découvrent comment le briser en analysant les répétitions."},
  {id:5,ep:'1844',nm:'Le Rail Fence',cv:'États-Unis',ic:'⚡',ans:'TELEGRAPH',fl:'MORSE',fm:"Morse révolutionna la communication.",hi:"Le Rail Fence dispose les lettres en zigzag sur plusieurs rails.",clr:'#ff6b00',
    mini:'⚡',
    lore:"Au milieu du XIXe siècle, la révolution industrielle transformait les communications. Le chiffre Rail Fence disposait les lettres en zigzag sur plusieurs lignes horizontales — les « rails ». Le nombre de rails, toujours petit, constituait la clé secrète.\n\nPour chiffrer, on écrit le message en zigzag descendant puis remontant. On transmet ensuite en lisant chaque rail de gauche à droite. Pour décoder, il faut reconnaître le nombre de rails utilisé et reconstituer le zigzag.\n\nEn 1844, Samuel Morse envoya le premier message télégraphique. Son code — des points et des traits attribués à chaque lettre de l'alphabet — révolutionna la communication mondiale. Ce système permettait de transmettre un message en quelques minutes là où un cavalier mettait des jours.\n\nLe télégraphe rendit possible la transmission instantanée de messages chiffrés. Un nombre pouvait être transmis en épelant son nom lettre par lettre dans le code de Morse, ajoutant une couche supplémentaire de complexité."},
  {id:6,ep:'1854',nm:'Le Chiffre de Playfair',cv:'Royaume-Uni',ic:'♛',ans:'CODE',fl:'WHEATSTONE',fm:"Charles Wheatstone inventa le chiffre.",hi:"Utilisé par l'armée britannique pendant les guerres coloniales.",clr:'#a855f7',
    mini:'👑',
    lore:"En 1854, Charles Wheatstone inventa un système utilisant une grille de 5×5 cases remplie selon un mot-clé. Bien que Wheatstone en soit l'inventeur, c'est Lord Playfair qui en fit la promotion — d'où le nom.\n\nL'armée britannique l'adopta pendant la Guerre des Boers et la Première Guerre mondiale. Les officiers victoriens, férus de culture classique, appréciaient les langues anciennes pour ajouter de l'obscurité à leurs messages.\n\nIl n'était pas rare que les positions dans la grille soient notées non pas en chiffres arabes ordinaires, mais dans un système de numération hérité de l'Antiquité méditerranéenne. Les premières lettres d'un alphabet très ancien — celui qui donna naissance au nôtre — servaient alors de coordonnées, chacune représentant un chiffre en partant de zéro.\n\nCette pratique ajoutait une étape de déchiffrement supplémentaire : il fallait d'abord traduire ces symboles anciens en nombres avant de pouvoir consulter la grille."},
  {id:7,ep:'1940',nm:'Enigma',cv:'Bletchley Park',ic:'⚙',ans:'WAR',fl:'TURING',fm:"Turing brisa Enigma et écourta la guerre.",hi:"La machine Enigma chiffrait avec 158 millions de millions de combinaisons.",clr:'#ef4444',
    mini:'⚙',
    lore:"La machine Enigma, utilisée par l'Allemagne nazie, possédait trois rotors mécaniques. Chaque rotor appliquait un décalage distinct à la lettre qu'il traitait. Les positions étaient changées quotidiennement selon un carnet de codes.\n\nÀ Bletchley Park, Alan Turing et son équipe analysèrent les habitudes de l'ennemi. Les opérateurs allemands ne choisissaient pas leurs positions au hasard : ils privilégiaient certaines catégories de nombres — une préférence mathématique qui fut leur perte.\n\nLa méthode de Turing reposait sur les « cribs » — des fragments de texte en clair qu'on devinait présents dans le message. Les transmissions interceptées contenaient presque toujours des mots courts et prévisibles liés au contexte du conflit mondial.\n\nGrâce à la « Bombe » — machine électromécanique de son invention — Turing réduisit l'espace des possibles. En combinant les contraintes connues sur chaque rotor, le nombre de combinaisons à tester devenait humainement gérable. On estime qu'il écourta la guerre de 2 à 4 ans."},
  {id:8,ep:'2026',nm:'Stéganographie',cv:'Internet',ic:'◉',ans:'INVISIBLE',fl:'PIXEL',fm:"Des messages cachés dans les pixels.",hi:"Un message caché dans les données brutes d'une image.",clr:'#06b6d4',
    mini:'💻',
    lore:"Du grec stéganos (« couvert ») et graphein (« écrire »), la stéganographie cache l'existence même du message. Contrairement au chiffrement qui rend illisible, la stéganographie dissimule le secret dans un support anodin — une image, un fichier audio, une vidéo.\n\nDans le monde numérique, chaque fichier image est composé de millions d'octets. Un éditeur hexadécimal révèle ces données brutes : des valeurs de 00 à FF qui encodent les pixels, les métadonnées, la structure du fichier.\n\nLa technique la plus élémentaire consiste à glisser du texte là où personne ne regarde : après que toutes les données légitimes du fichier se terminent. L'image s'affiche parfaitement — mais un observateur attentif, armé du bon outil, découvrira que le fichier contient plus qu'il n'y paraît.\n\nDes techniques plus sophistiquées modifient les bits les moins significatifs des pixels (LSB). L'œil humain ne perçoit pas la différence, mais les données sont bien là, dissimulées dans le bruit numérique."}
];

// Answer input component
const AI=({v,ch,sub,ph,er,ml=20})=>(
  <div className="space-y-3">
    <input type="text" value={v} onChange={e=>ch(san(e.target.value))} onKeyDown={e=>e.key==='Enter'&&sub()} placeholder={ph} maxLength={ml} autoCorrect="off" autoCapitalize="characters" autoComplete="off" spellCheck={false} inputMode="text" className={`w-full px-4 py-3.5 text-xl fm text-center rounded-lg border-2 bg-black/50 text-cyan-300 tracking-widest placeholder-cyan-800 ${er?'border-red-500 shake':'border-cyan-500/30 focus:border-cyan-400'} focus:outline-none transition-all`}/>
    <button onClick={sub} className="w-full py-3.5 bg-gradient-to-r from-cyan-600 to-blue-700 text-white rounded-lg ft tracking-widest text-sm uppercase active:scale-[0.98] transition-transform shadow-lg shadow-cyan-500/20 border border-cyan-400/30">▹ DÉCHIFFRER</button>
  </div>
);

// History Modal component

  return(
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" onClick={onClose}>

      <div className="relative max-w-lg w-full max-h-[85vh] rounded-2xl overflow-hidden fi" onClick={e=>e.stopPropagation()} style={{background:'linear-gradient(135deg, rgba(10,10,30,.95), rgba(20,20,50,.95))',border:`2px solid ${ch.clr}50`,boxShadow:`0 0 40px ${ch.clr}20`}}>
        {/* Close button */}

        {/* Header with miniature */}

          <div className="flex items-center justify-center gap-2 mt-2">
            <span className="fm text-xs px-3 py-1 rounded-full border" style={{color:ch.clr,borderColor:ch.clr+'50',background:ch.clr+'10'}}>{ch.ep}</span>
            <span className="fm text-xs px-3 py-1 rounded-full border border-gray-600 text-gray-400">{ch.cv}</span>
          </div>
        </div>
        {/* Scrollable content */}
        <div className="px-6 pb-6 overflow-y-auto" style={{maxHeight:'55vh'}}>
          <div className="h-px w-full my-4" style={{background:`linear-gradient(90deg, transparent, ${ch.clr}60, transparent)`}}></div>
          {ch.lore.split('\n\n').map((p,i)=>(
            <p key={i} className="text-gray-300 leading-relaxed mb-4 text-sm">{p}</p>
          ))}
          <div className="mt-4 p-3 rounded-lg border border-yellow-500/30 bg-yellow-500/5">
            <p className="fm text-xs text-yellow-400 uppercase tracking-widest mb-1">💡 Indice caché dans le texte</p>
            <p className="text-yellow-200/70 text-xs italic">Relisez attentivement l'histoire ci-dessus...</p>
          </div>
        </div>
      </div>
    </div>
  );
};
const C1=({onS})=>{
  const[cols,setC]=useState(2);
  const[a,setA]=useState('');
  const[e,setE]=useState(false);
  const enc='LIEDOANS';
  const grid=useMemo(()=>{const r=Math.ceil(enc.length/cols);const g=Array.from({length:r},()=>Array(cols).fill(''));let i=0;for(let c=0;c<cols;c++)for(let r2=0;r2<r;r2++)if(i<enc.length)g[r2][c]=enc[i++];return g},[cols]);
  const sub=()=>{if(norm(a)===CH[0].ans)onS();else{setE(true);setTimeout(()=>setE(false),500)}};
  return(<div className="space-y-5">
    <div className="glass rounded-lg p-4"><p className="text-cyan-100 leading-relaxed">Trouvez le bon <strong className="text-cyan-300">nombre de colonnes</strong>. La grille se réorganise : lisez <strong className="text-cyan-300">ligne par ligne</strong> pour trouver le mot.</p></div>
    <div className="glass2 rounded-lg p-5 border-glow-cyan">
      <p className="ft text-xs uppercase tracking-[0.3em] text-cyan-400 mb-3 text-center glow-cyan">Données interceptées</p>
      <div className="flex justify-center gap-1 flex-wrap">{enc.split('').map((c,i)=>(<div key={i} className="w-9 h-11 flex items-center justify-center bg-cyan-950/80 text-cyan-300 fm font-bold text-xl border border-cyan-500/30 rounded">{c}</div>))}</div>
    </div>
    <div className="glass rounded-lg p-5">
      <p className="ft text-xs uppercase tracking-[0.2em] text-cyan-400 mb-4 text-center">Paramètre : colonnes</p>

      <a href="https://www.rapidtables.com/convert/number/hex-to-ascii.html" target="_blank" rel="noopener" className="block text-center text-sm text-cyan-400 underline font-bold">🔗 Étape 2 : Convertisseur Hex → ASCII</a>
    </div>
    <div className="glass rounded-lg p-3"><p className="text-xs text-cyan-500 text-center fm">Astuce : dans hexed.it, cherchez (Ctrl+F) du texte à la fin du fichier</p></div>
    <AI v={a} ch={setA} sub={sub} ph="Le mot caché (après flag=)..." er={e}/>
  </div>);
};

const CC=[C1,C2,C3,C4,C5,C6,C7,C8];

// ===== SESSION URL =====
const KEY=173;
const encS=d=>{const bm=d.reduce((a,v,i)=>a|(v?1<<i:0),0);return btoa(String(bm^KEY))};
const decS=s=>{try{const bm=parseInt(atob(s))^KEY;return Array.from({length:8},(_,i)=>Boolean(bm&(1<<i)))}catch(e){return Array(8).fill(false)}};
const updURL=d=>{const s=encS(d);const u=new URL(window.location);u.searchParams.set('s',s);window.history.replaceState({},'',u)};
const readURL=()=>{const p=new URLSearchParams(window.location.search);const s=p.get('s');return s?decS(s):Array(8).fill(false)};

// ===== APP =====
const App=()=>{
  const[v,setV]=useState('home');
  const[ci,setCI]=useState(0);
  const[done,setD]=useState(()=>readURL());
  const[flags,setF]=useState(()=>{const d=readURL();return d.reduce((a,v,i)=>{if(v)a.push(i);return a},[])});
  const[showLore,setLore]=useState(false);
  useEffect(()=>{window.scrollTo(0,0);setLore(false)},[v,ci]);
  const solve=()=>{const n=[...done];n[ci]=true;setD(n);updURL(n);if(!flags.includes(ci))setF([...flags,ci]);setV('hist')};
  const go=i=>{setCI(i);setV('ch')};
  const next=()=>{if(ci<7){setCI(ci+1);setV('ch')}else setV('win')};
  const cnt=done.filter(Boolean).length;

  if(v==='home')return(
    <div className="min-h-screen px-4 py-8 sm:py-12"><div className="max-w-md mx-auto fi">
      <div className="text-center mb-10">
        <div className="text-6xl sm:text-7xl mb-4 ns pulse">𓂀</div>
        <h1 className="ft text-2xl sm:text-3xl font-bold text-white mb-1 tracking-[0.2em] uppercase neon-shimmer">CRYPTOGRAPHIA</h1>
        <p className="text-cyan-400/60 fm text-sm tracking-widest">// 2500 ANS DE SECRETS //</p>
      </div>

      <div className="glass rounded-xl p-5 mb-6 border-glow-cyan">
        <div className="flex items-center justify-between mb-3"><span className="text-xs uppercase tracking-[0.2em] text-cyan-400 ft">Progression</span><span className="ft font-bold text-cyan-300 text-lg">{cnt}<span className="text-cyan-600">/8</span></span></div>
        <div className="h-2 bg-cyan-950 rounded-full overflow-hidden border border-cyan-800"><div className="h-full bg-gradient-to-r from-cyan-500 to-blue-500 transition-all duration-700" style={{width:`${cnt/8*100}%`}}/></div>
        {flags.length>0&&(<div className="mt-4 pt-4 border-t border-cyan-800/40"><p className="text-xs uppercase tracking-widest text-cyan-500 ft mb-2">Flags collectés</p><div className="flex flex-wrap gap-1.5">{flags.map(i=>(<span key={i} className="text-xs px-2 py-0.5 bg-cyan-950 text-cyan-300 rounded border border-cyan-500/30 fm tracking-wider">{CH[i].fl}</span>))}</div></div>)}
      </div>

      <div className="space-y-3">{CH.map((c,i)=>{const d=done[i];return(
        <button key={c.id} onClick={()=>go(i)} className="w-full text-left p-4 rounded-xl border transition-all glass active:scale-[0.98]" style={{borderColor:d?c.clr+'60':c.clr+'20',boxShadow:d?`0 0 12px ${c.clr}30`:'none'}}>
          <div className="flex items-center gap-3">
            <div className="w-12 h-12 rounded-full flex items-center justify-center text-2xl flex-shrink-0 ft border-2" style={{borderColor:c.clr+'60',backgroundColor:d?c.clr+'20':'transparent',color:d?c.clr:'#666'}}>{d?<Ic n="ck" s={24}/>:ROM[i]}</div>
            <div className="flex-1 min-w-0"><div className="flex items-center gap-2 mb-0.5"><span className="text-xs ft font-bold tracking-widest" style={{color:c.clr}}>{c.ep}</span><span className="text-xs text-gray-600">·</span><span className="text-xs text-gray-500 truncate">{c.cv}</span></div><div className="ft font-bold text-gray-200 truncate tracking-wide text-sm sm:text-base">{c.nm}</div></div>
            <div>{d?<span className="text-2xl ns">{c.ic}</span>:<Ic n="cr" s={20} c="text-gray-600"/>}</div>
          </div>
        </button>
      )})}</div>

      {cnt===8&&(<button onClick={()=>setV('win')} className="mt-6 w-full py-4 bg-gradient-to-r from-cyan-600 to-blue-700 text-white rounded-xl ft font-bold tracking-widest uppercase active:scale-[0.98] flex items-center justify-center gap-2 shadow-lg shadow-cyan-500/30 border border-cyan-400/30"><Ic n="tp" s={22}/> Épilogue</button>)}
      {cnt>0&&cnt<8&&(<button onClick={()=>setV('win')} className="mt-6 w-full py-3 glass text-cyan-400 rounded-xl border-2 border-cyan-500/30 ft text-xs uppercase tracking-widest active:scale-[0.98] flex items-center justify-center gap-2">🏆 Voir mes trésors ({cnt}/8)</button>)}

      <p className="text-center text-xs text-gray-700 mt-10 fm">CRYPTOGRAPHIA.v2 // MMXXVI</p>
    </div></div>
  );

  if(v==='ch'){const c=CH[ci];const Comp=CC[ci];return(
    <div className="min-h-screen px-4 py-6"><div className="max-w-md mx-auto fi">
      <div className="flex items-center justify-between mb-4">
        <button onClick={()=>setV('home')} className="text-cyan-500 flex items-center gap-1 text-sm ft uppercase tracking-widest active:text-cyan-300"><Ic n="cl" s={16}/> Retour</button>
        <button onClick={()=>setLore(true)} className="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs ft uppercase tracking-widest active:scale-95 border" style={{color:c.clr,borderColor:c.clr+'50',background:c.clr+'10'}}>📜 Histoire</button>
      </div>
      <div className="glass rounded-xl border overflow-hidden mb-6" style={{borderColor:c.clr+'40',boxShadow:`0 0 30px ${c.clr}15`}}>
        <div className="relative p-6 overflow-hidden" style={{background:`linear-gradient(135deg, ${c.clr}15, transparent, ${c.clr}08)`}}>
          <div className="absolute top-0 right-0 text-9xl opacity-10 ns" style={{transform:'translate(20%,-20%)',color:c.clr}}>{c.ic}</div>
          <div className="relative"><div className="flex items-center justify-between mb-3"><span className="text-xs uppercase tracking-[0.3em] ft" style={{color:c.clr}}>Chapitre {ROM[ci]}</span><span className="text-xs ft text-gray-500 tracking-widest">{c.ep}</span></div><div className="text-5xl mb-3 ns">{c.ic}</div><h2 className="ft text-2xl sm:text-3xl font-bold mb-1 tracking-wide text-white">{c.nm}</h2><p className="text-gray-400">{c.cv}</p></div>
        </div>
        <div className="p-4 sm:p-5"><Comp onS={solve}/></div>
      </div>
      {showLore&&<Modal ch={c} onClose={()=>setLore(false)}/>}
    </div></div>
  );}

  if(v==='hist'){const c=CH[ci];return(
    <div className="min-h-screen px-4 py-8"><div className="max-w-md mx-auto fi">
      <div className="text-center mb-6"><div className="inline-flex items-center justify-center w-24 h-24 rounded-full mb-4 sr border-4" style={{borderColor:c.clr,backgroundColor:c.clr+'20',boxShadow:`0 0 30px ${c.clr}60`}}><Ic n="ul" s={40} c="text-white"/></div><p className="ft text-xs uppercase tracking-[0.3em] glow-green text-green-400">Énigme résolue</p></div>
      <div className="glass rounded-xl p-6 mb-5" style={{borderColor:c.clr+'40'}}>
        <div className="text-center mb-4"><div className="text-5xl mb-3 ns">{c.ic}</div><h2 className="ft text-2xl font-bold text-white tracking-wide">{c.nm}</h2><p className="text-sm ft tracking-widest mt-1" style={{color:c.clr}}>{c.ep} · {c.cv.toUpperCase()}</p></div>
        <p className="text-gray-300 leading-relaxed italic">{c.hi}</p>
      </div>
      <div className="rounded-xl p-6 mb-6 border-2" style={{background:`linear-gradient(135deg, ${c.clr}10, #050510, ${c.clr}05)`,borderColor:c.clr+'60',boxShadow:`0 0 25px ${c.clr}30`}}>
        <div className="text-center"><p className="ft text-xs uppercase tracking-[0.3em] mb-3" style={{color:c.clr}}>Trésor découvert</p>
          <div className="bg-black/50 rounded-lg py-4 px-3 border mb-3" style={{borderColor:c.clr+'40'}}><p className="fm text-xs uppercase tracking-widest mb-2" style={{color:c.clr+'99'}}>FLAG</p><p className="text-2xl sm:text-3xl ft font-bold neon-shimmer tracking-[0.15em]">{c.fl}</p></div>
          <p className="italic text-gray-400 text-sm">{c.fm}</p>
        </div>
      </div>
      <div className="space-y-3">
        <button onClick={next} className="w-full py-4 bg-gradient-to-r from-cyan-600 to-blue-700 text-white rounded-xl ft tracking-widest uppercase text-sm active:scale-[0.98] flex items-center justify-center gap-2 shadow-lg shadow-cyan-500/20 border border-cyan-400/30">{ci<7?<>Énigme suivante <Ic n="cr" s={18}/></>:<>Épilogue <Ic n="tp" s={18}/></>}</button>
        <button onClick={()=>setV('win')} className="w-full py-3 bg-gradient-to-r from-yellow-600/80 to-amber-700/80 text-yellow-100 rounded-xl ft text-xs uppercase tracking-widest active:scale-[0.98] flex items-center justify-center gap-2 border border-yellow-500/30">🏆 Voir mes trésors ({cnt}/8)</button>
        <button onClick={()=>setV('home')} className="w-full py-3 glass text-gray-400 rounded-xl ft text-xs uppercase tracking-widest">Retour au sommaire</button>
      </div>
    </div></div>
  );}

  if(v==='win')return(
    <div className="min-h-screen px-4 py-10 flex items-center"><div className="max-w-md mx-auto text-center fi">
      <div className="text-7xl mb-6 ns pulse">🏆</div>
      <h1 className="ft text-3xl sm:text-4xl font-bold mb-3 tracking-[0.1em] neon-shimmer">{cnt===8?'MAÎTRE DES CODES':'PROGRESSION'}</h1>
      <div className="h-px bg-gradient-to-r from-transparent via-cyan-400 to-transparent w-32 mx-auto mb-4"></div>
      <p className="italic text-gray-400 mb-8">{cnt===8?'Tous les secrets ont été percés.':cnt+' flag'+(cnt>1?'s':'')+' sur 8 collecté'+(cnt>1?'s':'')+'.'}</p>
      <div className="glass rounded-xl border border-cyan-500/30 p-5 mb-6 text-left"><p className="ft text-xs uppercase tracking-[0.3em] text-cyan-400 mb-4 text-center">Trésors ({cnt}/8)</p><div className="space-y-2">{flags.map(i=>{const c=CH[i];return(<div key={c.id} className="flex items-center gap-3 bg-black/30 rounded-md p-2 border" style={{borderColor:c.clr+'30'}}><div className="w-10 h-10 rounded-full border flex items-center justify-center text-xl flex-shrink-0" style={{borderColor:c.clr+'60',color:c.clr}}>{c.ic}</div><div className="flex-1 min-w-0"><p className="text-xs ft tracking-wider" style={{color:c.clr}}>{c.ep}</p><p className="fm font-bold text-gray-200 tracking-wider truncate">{c.fl}</p></div></div>)})}{cnt<8&&<p className="text-center text-gray-600 italic text-sm mt-3">{8-cnt} énigme{8-cnt>1?'s':''} restante{8-cnt>1?'s':''}</p>}</div></div>
      <button onClick={()=>setV('home')} className="w-full py-4 bg-gradient-to-r from-cyan-600 to-blue-700 text-white rounded-xl ft font-bold uppercase tracking-widest active:scale-[0.98] shadow-lg shadow-cyan-500/30 border border-cyan-400/30">{cnt===8?'Recommencer':'Continuer'}</button>
    </div></div>
  );
  return null;
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
