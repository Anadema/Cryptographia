    /* === FLOATING SYMBOLS === */

    /* === GLITCH TITLE === */
    @keyframes glitch1{0%,100%{clip-path:inset(0 0 96% 0)}25%{clip-path:inset(40% 0 30% 0)}50%{clip-path:inset(80% 0 5% 0)}75%{clip-path:inset(10% 0 60% 0)}}
    @keyframes glitch2{0%,100%{clip-path:inset(96% 0 0 0)}25%{clip-path:inset(20% 0 50% 0)}50%{clip-path:inset(5% 0 80% 0)}75%{clip-path:inset(60% 0 10% 0)}}

    /* === ANIMATIONS === */
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

    @keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

    .sr{animation:sealReveal .8s cubic-bezier(.34,1.56,.64,1) forwards}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    .pulse{animation:pulse 2s ease-in-out infinite}
    @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
    .neon-shimmer{background:linear-gradient(90deg,#00f0ff,#ff2d95,#00ff41,#ffd700,#00f0ff);background-size:200% 100%;animation:shimmer 3s linear infinite;-webkit-background-clip:text;background-clip:text;color:transparent}
    @keyframes borderPulse{0%,100%{border-color:rgba(0,240,255,.3)}50%{border-color:rgba(0,240,255,.8)}}
    .border-pulse{animation:borderPulse 2s ease-in-out infinite}

    @keyframes btnGlow{0%,100%{box-shadow:0 0 5px var(--gclr),0 0 10px var(--gclr)}50%{box-shadow:0 0 10px var(--gclr),0 0 25px var(--gclr),0 0 40px var(--gclr)}}

<script>
// Generate floating symbols
const symbols='𓂀♜⊞⚜⚡♛⚙◉αβγδ01···---'.split('');
const bg=document.getElementById('bgSymbols');
for(let i=0;i<25;i++){
  const s=document.createElement('div');
  s.className='sym';
  s.textContent=symbols[i%symbols.length];
  s.style.left=Math.random()*100+'%';
  s.style.animationDuration=(15+Math.random()*25)+'s';
  s.style.animationDelay=(Math.random()*20)+'s';
  s.style.fontSize=(1.5+Math.random()*2.5)+'rem';
  s.style.color=['#ffffff','#e0d0ff','#ffffff','#d0c0ff'][Math.floor(Math.random()*4)];
  bg.appendChild(s);
}
</script>

<script type="text/babel" data-presets="react">
const{useState,useMemo,useEffect}=React;
const norm=s=>{if(typeof s!=='string')return'';return s.toUpperCase().replace(/[^A-Z0-9]/g,'').trim().slice(0,50)};
const san=s=>{if(typeof s!=='string')return'';return s.replace(/[<>"'`\\]/g,'').slice(0,30)};

const Ic=({n,s=20,c=''})=>{const p={
  cr:<polyline points="9 18 15 12 9 6" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>,
  cl:<polyline points="15 18 9 12 15 6" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>,
  ck:<polyline points="20 6 9 17 4 12" stroke="currentColor" strokeWidth="3" fill="none" strokeLinecap="round" strokeLinejoin="round"/>,
  tp:<g stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></g>,
  ul:<g stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></g>,
};return <svg width={s} height={s} viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" className={c}>{p[n]}</svg>};

const ROM=['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI'];

const CH=[
  {id:1,ep:'−500',nm:'La Scytale',cv:'Sparte',ic:'𓂀',ans:'LEONIDAS',fl:'LACEDEMONE',fm:"L'antique nom de Sparte.",hi:"Les généraux spartiates enroulaient une bande de cuir autour d'un bâton appelé scytale.",clr:'#00f0ff',
    mini:'🛡️',wiki:'Scytale',
    lore:"Au Ve siècle avant J.-C., Sparte dominait le Péloponnèse par la force de ses guerriers. Les éphores — magistrats suprêmes — devaient communiquer secrètement avec leurs généraux déployés au loin.\n\nIls inventèrent la scytale : une bande de cuir étroite enroulée en spirale autour d'un bâton cylindrique à section carrée parfaite. Le message s'écrivait horizontalement, puis la bande était déroulée pour être confiée au messager. Sans le bon bâton, impossible de lire quoi que ce soit.\n\nLe plus célèbre utilisateur de la scytale fut sans doute un roi spartiate légendaire, héros des Thermopyles, qui mena 300 guerriers face à l'Empire perse en 480 av. J.-C. Les messages chiffrés par scytale jouèrent un rôle crucial dans la coordination des forces grecques.\n\nLe nombre de faces visibles du bâton déterminait le chiffrement. Pour reconstituer le message, il fallait enrouler la bande sur un bâton identique et lire horizontalement."},
  {id:2,ep:'−50',nm:'Le Chiffre de César',cv:'Rome',ic:'♜',ans:'VENIVIDIVICI',fl:'RUBICON',fm:"Le fleuve franchi par César.",hi:"César décalait chaque lettre selon une clé secrète.",clr:'#ff2d95',
    mini:'🏛️',wiki:'Caesar_cipher',
    lore:"Jules César, consul puis dictateur de Rome, utilisait un système de chiffrement d'une simplicité trompeuse. Chaque lettre de l'alphabet était remplacée par celle située quelques positions plus loin — un décalage si modeste qu'on pouvait le compter sur les doigts d'une main.\n\nSuétone rapporte que César l'utilisait pour sa correspondance privée. À une époque où la majorité de la population était illettrée, ce simple décalage suffisait à protéger les messages les plus sensibles.\n\nLes Romains notaient leurs nombres avec des lettres : I, V, X, L, C, D, M. Le décalage de César est souvent exprimé dans cette notation ancestrale.\n\nAprès sa conquête de la Gaule, César envoya au Sénat un message devenu légendaire — une phrase de victoire en trois mots latins, si concise et percutante qu'elle traversa les siècles. Quelques années plus tôt, il avait franchi un fleuve fameux, déclenchant la guerre civile qui transforma la République en Empire."},
  {id:3,ep:'−150',nm:'Le Carré de Polybe',cv:'Grèce',ic:'⊞',ans:'SECRET',fl:'TORCHES',fm:"Deux groupes de torches transmettaient les coordonnées.",hi:"Polybe inventa une grille 5×5 où chaque lettre est repérée par deux chiffres.",clr:'#00ff41',
    mini:'🔥',wiki:'Polybius_square',
    lore:"Polybe, historien grec du IIe siècle av. J.-C., inventa un système de communication à distance remarquable. Il disposa les 25 lettres de l'alphabet dans une grille carrée, où chaque lettre est identifiée par sa position : un premier chiffre pour la ligne, un second pour la colonne.\n\nPour transmettre à distance, Polybe utilisait des torches allumées sur les collines : un premier groupe indiquait la rangée, un second la colonne. Ce système permettait de communiquer la nuit sur de grandes distances, à une vitesse surprenante pour l'époque.\n\nDes siècles plus tard, les prisonniers de guerre adaptèrent cette méthode en tapant sur les murs de leurs cellules — le fameux « code des prisonniers ». Un prisonnier tapait d'abord le numéro de ligne, puis celui de colonne, pour chaque lettre du message.\n\nLa grille de Polybe est aussi à la base de nombreux chiffrements modernes. Sa simplicité est sa force : il suffit de connaître les coordonnées pour déchiffrer n'importe quel message."},
  {id:4,ep:'1586',nm:'Le Chiffre de Vigenère',cv:'France',ic:'⚜',ans:'TROIS',fl:'INDECHIFFRABLE',fm:"Son surnom pendant trois siècles.",hi:"Une clé secrète décale différemment chaque lettre.",clr:'#ffd700',
    mini:'📜',wiki:'Vigen%C3%A8re_cipher',
    lore:"Blaise de Vigenère, diplomate français à la cour d'Henri III, perfectionna en 1586 un système polyalphabétique. Contrairement au chiffre de César (décalage fixe), Vigenère utilise une clé secrète qui modifie chaque lettre différemment.\n\nLa clé est un mot court et mémorable — souvent un mot de quatre lettres évoquant la puissance ou la noblesse. On raconte que les diplomates français choisissaient des noms d'animaux majestueux, emblèmes du pouvoir royal. Cette clé se répète cycliquement sur toute la longueur du message.\n\nPour chiffrer, on additionne chaque lettre du texte avec la lettre correspondante de la clé (A=0, B=1...). Pour déchiffrer, on soustrait.\n\nPendant 300 ans, ce chiffre fut surnommé « le chiffre indéchiffrable ». Il fallut attendre le XIXe siècle pour que Charles Babbage et Friedrich Kasiski découvrent comment le briser en analysant les répétitions."},
  {id:5,ep:'1844',nm:'Le Rail Fence',cv:'États-Unis',ic:'⚡',ans:'TELEGRAPH',fl:'MORSE',fm:"Morse révolutionna la communication.",hi:"Le Rail Fence dispose les lettres en zigzag sur plusieurs rails.",clr:'#ff6b00',
    mini:'⚡',wiki:'Morse_code',
    lore:"Au milieu du XIXe siècle, la révolution industrielle transformait les communications. Le chiffre Rail Fence disposait les lettres en zigzag sur plusieurs lignes horizontales — les « rails ». Le nombre de rails, toujours petit, constituait la clé secrète.\n\nPour chiffrer, on écrit le message en zigzag descendant puis remontant. On transmet ensuite en lisant chaque rail de gauche à droite. Pour décoder, il faut reconnaître le nombre de rails utilisé et reconstituer le zigzag.\n\nEn 1844, Samuel Morse envoya le premier message télégraphique. Son code — des points et des traits attribués à chaque lettre de l'alphabet — révolutionna la communication mondiale. Ce système permettait de transmettre un message en quelques minutes là où un cavalier mettait des jours.\n\nLe télégraphe rendit possible la transmission instantanée de messages chiffrés. Un nombre pouvait être transmis en épelant son nom lettre par lettre dans le code de Morse, ajoutant une couche supplémentaire de complexité."},
  {id:6,ep:'1854',nm:'Le Chiffre de Playfair',cv:'Royaume-Uni',ic:'♛',ans:'CODE',fl:'WHEATSTONE',fm:"Charles Wheatstone inventa le chiffre.",hi:"Utilisé par l'armée britannique pendant les guerres coloniales.",clr:'#a855f7',
    mini:'👑',wiki:'Playfair_cipher',
    lore:"En 1854, Charles Wheatstone inventa un système utilisant une grille de 5×5 cases remplie selon un mot-clé. Bien que Wheatstone en soit l'inventeur, c'est Lord Playfair qui en fit la promotion — d'où le nom.\n\nL'armée britannique l'adopta pendant la Guerre des Boers et la Première Guerre mondiale. Les officiers victoriens, férus de culture classique, appréciaient les langues anciennes pour ajouter de l'obscurité à leurs messages.\n\nIl n'était pas rare que les positions dans la grille soient notées non pas en chiffres arabes ordinaires, mais dans un système de numération hérité de l'Antiquité méditerranéenne. Les premières lettres d'un alphabet très ancien — celui qui donna naissance au nôtre — servaient alors de coordonnées, chacune représentant un chiffre en partant de zéro.\n\nCette pratique ajoutait une étape de déchiffrement supplémentaire : il fallait d'abord traduire ces symboles anciens en nombres avant de pouvoir consulter la grille."},
  {id:7,ep:'1940',nm:'Enigma',cv:'Bletchley Park',ic:'⚙',ans:'WAR',fl:'TURING',fm:"Turing brisa Enigma et écourta la guerre.",hi:"La machine Enigma chiffrait avec 158 millions de millions de combinaisons.",clr:'#ef4444',
    mini:'⚙',wiki:'Enigma_machine',
    lore:"La machine Enigma, utilisée par l'Allemagne nazie, possédait trois rotors mécaniques. Chaque rotor appliquait un décalage distinct à la lettre qu'il traitait. Les positions étaient changées quotidiennement selon un carnet de codes.\n\nÀ Bletchley Park, Alan Turing et son équipe analysèrent les habitudes de l'ennemi. Les opérateurs allemands ne choisissaient pas leurs positions au hasard : ils privilégiaient certaines catégories de nombres — une préférence mathématique qui fut leur perte.\n\nLa méthode de Turing reposait sur les « cribs » — des fragments de texte en clair qu'on devinait présents dans le message. Les transmissions interceptées contenaient presque toujours des mots courts et prévisibles liés au contexte du conflit mondial.\n\nGrâce à la « Bombe » — machine électromécanique de son invention — Turing réduisit l'espace des possibles. En combinant les contraintes connues sur chaque rotor, le nombre de combinaisons à tester devenait humainement gérable. On estime qu'il écourta la guerre de 2 à 4 ans."},
  {id:8,ep:'2026',nm:'Stéganographie',cv:'Internet',ic:'◉',ans:'INVISIBLE',fl:'PIXEL',fm:"Des messages cachés dans les pixels.",hi:"Un message caché dans les données brutes d'une image.",clr:'#06b6d4',
    mini:'💻',wiki:'Steganography',
    lore:"Du grec stéganos (« couvert ») et graphein (« écrire »), la stéganographie cache l'existence même du message. Contrairement au chiffrement qui rend illisible, la stéganographie dissimule le secret dans un support anodin — une image, un fichier audio, une vidéo.\n\nDans le monde numérique, chaque fichier image est composé de millions d'octets. Un éditeur hexadécimal révèle ces données brutes : des valeurs de 00 à FF qui encodent les pixels, les métadonnées, la structure du fichier.\n\nLa technique la plus élémentaire consiste à glisser du texte là où personne ne regarde : après que toutes les données légitimes du fichier se terminent. L'image s'affiche parfaitement — mais un observateur attentif, armé du bon outil, découvrira que le fichier contient plus qu'il n'y paraît.\n\nDes techniques plus sophistiquées modifient les bits les moins significatifs des pixels (LSB). L'œil humain ne perçoit pas la différence, mais les données sont bien là, dissimulées dans le bruit numérique."},
  {id:9,ep:'1500 av.J-C',nm:'Le Chiffre Atbash',cv:'Hébreux',ic:'✡',ans:'CRYPTO',fl:'HEBREUX',fm:"L'un des plus anciens chiffrements connus.",hi:"Inversez l'alphabet : A↔Z, B↔Y, C↔X...",clr:'#6366f1',mini:'📖',wiki:'Dead_Sea_Scrolls',imgUrl:'https://josephkimiri.github.io/assets/img/blog/atbash.jpg',
    lore:"L'Atbash est l'un des plus anciens chiffrements connus, originaire de la tradition hébraïque. Son principe est d'une simplicité radicale : on inverse l'alphabet. La première lettre devient la dernière, la deuxième l'avant-dernière, et ainsi de suite.\n\nA devient Z, B devient Y, C devient X... Ce système est mentionné dans la Bible, notamment dans le Livre de Jérémie, où le mot « Sheshakh » (ששך) est un Atbash pour « Babel » (בבל).\n\nMalgré sa simplicité, l'Atbash a traversé les millénaires. Les kabbalistes l'utilisaient pour cacher des significations mystiques dans les textes sacrés. Certains groupes ésotériques l'emploient encore aujourd'hui."},
  {id:10,ep:'1963',nm:'Le Code Binaire',cv:'Informatique',ic:'💾',ans:'HACK',fl:'OCTET',fm:"8 bits forment un octet, un octet forme un caractère.",hi:"Chaque lettre est encodée en 8 bits (0 et 1).",clr:'#10b981',mini:'🖥️',wiki:'ASCII',imgUrl:'https://nicolaskaplan.fr/blog/wp-content/uploads/2017/04/binary-computer-code-repeating-vector-background-illustration-continuous-pattern-left-right-up-and-down_135022250.jpeg',
    lore:"En 1963, le standard ASCII (American Standard Code for Information Interchange) fut adopté. Chaque caractère — lettre, chiffre, symbole — reçut un numéro unique de 0 à 127, encodé en 7 puis 8 bits (un octet).\n\nLa lettre A vaut 65, B vaut 66... En binaire, chaque lettre devient une suite de 8 chiffres : des 0 et des 1. Par exemple, A = 01000001.\n\nCe système est le fondement de toute l'informatique moderne. Chaque fichier, chaque message, chaque image que vous voyez sur un écran est au fond une immense suite de 0 et de 1, organisée en paquets de huit."},
  {id:11,ep:'1980',nm:'Le ROT13',cv:'Internet',ic:'🔄',ans:'INTERNET',fl:'USENET',fm:"Le réseau Usenet popularisa ce chiffrement trivial.",hi:"Décalez chaque lettre de 13 positions dans l'alphabet.",clr:'#f59e0b',mini:'🌐',wiki:'ROT13',imgUrl:'https://miro.medium.com/v2/resize:fit:594/format:webp/0*m3VShx1oxynBnACy.jpeg',
    lore:"Au début des années 1980, le réseau Usenet — ancêtre des forums — avait un problème : comment partager des spoilers ou des blagues offensantes sans choquer ceux qui ne veulent pas les lire ?\n\nLa solution : ROT13, un chiffre de César avec un décalage de 13. Sa particularité unique : appliquer ROT13 deux fois redonne le texte original, car l'alphabet a 26 lettres et 13 est exactement la moitié.\n\nROT13 n'est pas un vrai chiffrement — c'est un « rideau » volontaire. Quiconque connaît ROT13 peut le décoder instantanément. Mais c'est devenu une tradition sur Internet et un terme de la culture hacker."},
  {id:12,ep:'1987',nm:'Le Base64',cv:'Web',ic:'📧',ans:'ENCODE',fl:'MIME',fm:"Le format MIME utilise Base64 pour les pièces jointes email.",hi:"Un encodage qui transforme des données binaires en texte lisible.",clr:'#ec4899',mini:'📨',wiki:'Base64',wikiLang:'fr',
    lore:"Base64 n'est pas un chiffrement — c'est un encodage. Il transforme n'importe quelles données binaires en une suite de 64 caractères « sûrs » : A-Z, a-z, 0-9, + et /.\n\nInventé pour les emails (norme MIME, 1987), il permet d'envoyer des fichiers binaires (images, PDF) à travers des protocoles qui n'acceptent que du texte. Chaque groupe de 3 octets est converti en 4 caractères Base64.\n\nOn reconnaît facilement du Base64 : des chaînes de lettres et chiffres mélangés, souvent terminées par un ou deux signes =. Pour le décoder, un simple outil en ligne suffit."},
  {id:13,ep:'1991',nm:'Le Hash MD5',cv:'Sécurité',ic:'🔒',ans:'CYBER',fl:'HASH',fm:"Une empreinte unique et irréversible.",hi:"Un hash transforme un texte en empreinte fixe. Impossible à inverser... sauf avec une liste de mots.",clr:'#ef4444',mini:'🔐',wiki:'MD5',imgUrl:'https://upload.wikimedia.org/wikipedia/commons/thumb/2/2b/Cryptographic_Hash_Function.svg/500px-Cryptographic_Hash_Function.svg.png',
    lore:"MD5 (Message-Digest Algorithm 5), créé par Ronald Rivest en 1991, produit une empreinte de 128 bits (32 caractères hexadécimaux) à partir de n'importe quelle donnée. C'est une fonction à sens unique : on ne peut pas retrouver le message original à partir du hash.\n\nMais il existe une faille : les « rainbow tables ». Ce sont d'immenses dictionnaires précalculés qui associent des millions de mots à leur hash MD5. Si votre mot de passe est un mot courant, son hash est probablement dans une rainbow table.\n\nC'est pourquoi MD5 est considéré comme cassé pour la sécurité. Les systèmes modernes utilisent SHA-256 ou bcrypt. Mais pour ce défi, votre mission est de jouer le rôle d'un attaquant : retrouver le mot original à partir de son hash."},
  {id:14,ep:'1917',nm:'Le Chiffre XOR',cv:'Cryptographie',ic:'⊕',ans:'KEY',fl:'BIT',fm:"L'opération fondamentale de la cryptographie moderne.",hi:"XOR : si les bits sont identiques → 0, s'ils sont différents → 1.",clr:'#3b82f6',mini:'🔢',wiki:'XOR_cipher',imgUrl:'https://fabricenativel.github.io/Terminale/images/C15/xor1.png',
    lore:"L'opération XOR (OU exclusif) est le cœur de la cryptographie moderne. Son principe : comparer deux bits. S'ils sont identiques (0⊕0 ou 1⊕1), le résultat est 0. S'ils sont différents (0⊕1 ou 1⊕0), le résultat est 1.\n\nPour chiffrer, on XOR chaque octet du message avec un octet de la clé. Pour déchiffrer, on applique exactement la même opération — XOR est sa propre inverse.\n\nAvec des caractères ASCII : on convertit chaque lettre en nombre, on XOR avec la clé numérique, et on reconvertit en lettre. Une opération simple mais qui, combinée à des clés aléatoires suffisamment longues, produit un chiffrement incassable (le « one-time pad »)."},
  {id:15,ep:'1960',nm:'L\'Hexadécimal',cv:'Informatique',ic:'#️⃣',ans:'SECURE',fl:'BYTE',fm:"Base 16 : le langage des machines.",hi:"Chaque paire de caractères hex représente un octet ASCII.",clr:'#8b5cf6',mini:'💻',wiki:'Hexadecimal',imgUrl:'https://www.datanovia.com/en/wp-content/uploads/dn-tutorials/ggplot2/images/hextable-hexadecimal-color-chart.png',
    lore:"L'hexadécimal (base 16) utilise les chiffres 0-9 et les lettres A-F pour représenter les valeurs de 0 à 15. Deux chiffres hexadécimaux forment un octet (0 à 255), suffisant pour encoder un caractère ASCII.\n\nLes informaticiens préfèrent l'hexadécimal au binaire car il est plus compact : 8 chiffres binaires = 2 chiffres hex. Les adresses mémoire, les couleurs web (#FF0000 = rouge), les analyses forensiques — tout utilise l'hexadécimal.\n\nPour convertir de l'hex en texte : prenez chaque paire de caractères, trouvez sa valeur décimale, puis le caractère ASCII correspondant. Par exemple, 41 hex = 65 décimal = lettre A."},
  {id:16,ep:'1994',nm:'Le QR Code',cv:'Japon',ic:'📱',ans:'MATRIX',fl:'DENSO',fm:"Denso Wave inventa le QR Code pour l'industrie automobile.",hi:"Un code 2D qui stocke des données dans un motif de carrés noirs et blancs.",clr:'#14b8a6',mini:'📲',wiki:'Denso',
    lore:"En 1994, Masahiro Hara, ingénieur chez Denso Wave (filiale de Toyota), créa le QR Code (Quick Response Code) pour suivre les pièces automobiles dans les usines japonaises.\n\nContrairement au code-barres classique (1D), le QR Code stocke des données en deux dimensions — horizontalement et verticalement. Il peut contenir jusqu'à 7 089 chiffres ou 4 296 caractères.\n\nLes trois grands carrés dans les coins permettent au scanner de déterminer l'orientation. Le reste du motif encode les données avec correction d'erreur : même endommagé à 30%, un QR Code reste lisible.\n\nAujourd'hui omniprésent (menus, billets, paiements), le QR Code est aussi utilisé en stéganographie : on peut y cacher des messages que seul un scanner révèlera."}
];

// Wikipedia image component — tries 2 APIs for best coverage
const WikiImg=({title,alt,clr,icon,lang='en',directUrl})=>{
  const[src,setSrc]=useState(directUrl||null);
  const[done,setDone]=useState(!!directUrl);
  useEffect(()=>{
    if(directUrl){setSrc(directUrl);setDone(true);return}
    setDone(false);setSrc(null);
    // Try MediaWiki API first
    fetch('https://'+lang+'.wikipedia.org/w/api.php?action=query&titles='+title+'&prop=pageimages&format=json&pithumbsize=600&origin=*')
      .then(r=>r.json())
      .then(d=>{
        const p=Object.values(d.query.pages)[0];
        if(p&&p.thumbnail){setSrc(p.thumbnail.source);setDone(true)}
        else{
          // Fallback: try REST API
          fetch('https://'+lang+'.wikipedia.org/api/rest_v1/page/summary/'+title)
            .then(r=>r.json())
            .then(d2=>{if(d2.thumbnail)setSrc(d2.thumbnail.source);setDone(true)})
            .catch(()=>setDone(true))
        }
      })
      .catch(()=>setDone(true));
  },[title]);
  if(!done)return null;
  if(src)return(<div className="rounded-lg overflow-hidden border" style={{borderColor:clr+'30'}}>
    <img src={src} alt={alt} className="w-full object-contain" style={{maxHeight:'220px',filter:'brightness(0.85) contrast(1.1) saturate(0.85)',background:'rgba(0,0,0,.3)'}} onError={e=>{e.target.parentElement.style.display='none'}}/>
  </div>);
  return(<div className="rounded-lg overflow-hidden border h-32 flex items-center justify-center" style={{borderColor:clr+'30',background:'linear-gradient(135deg, '+clr+'15, rgba(0,0,0,.4), '+clr+'10)'}}>
    <div className="text-center"><div className="text-6xl mb-1 ns" style={{filter:'drop-shadow(0 0 12px '+clr+')'}}>{icon}</div><p className="ft text-xs uppercase tracking-widest" style={{color:clr+'90'}}>{alt}</p></div>
  </div>);
};

      <p className="ft text-xs uppercase tracking-[0.2em] text-blue-400 mb-2 text-center">Méthode</p>
      <div className="text-sm text-blue-200/160 text-center fm space-y-1">
        <p>1. Convertir la lettre en ASCII : H = 72</p>
        <p>2. XOR avec la clé : 72 ⊕ 3 = ?</p>
        <p>3. Reconvertir en lettre</p>
      </div>
      <div className="bg-black/30 rounded p-3 mt-3 fm text-xs text-center">
        <p className="text-gray-400 mb-1">Exemple fictif : M(77) ⊕ 3 = 78 = N</p>
        <p className="text-blue-400/60">XOR bit à bit : si même → 0, si différent → 1</p>
      </div>
    </div>
    <AI v={a} ch={setA} sub={sub} ph="Le mot déchiffré..." er={e}/>
    <a href="https://xor.pw/" target="_blank" rel="noopener" className="block text-center text-xs text-blue-500 underline">🔗 Calculateur XOR en ligne</a>
  </div>);
};

// ===== C15: HEXADÉCIMAL =====
const C15=({onS})=>{
  const[a,setA]=useState('');const[e,setE]=useState(false);
  const hexVals=['53','45','43','55','52','45'];
  const sub=()=>{if(norm(a)===CH[14].ans)onS();else{setE(true);setTimeout(()=>setE(false),500)}};
  return(<div className="space-y-5">
    <div className="glass rounded-lg p-4"><p className="text-violet-100 leading-relaxed"><strong className="text-violet-300">Hexadécimal :</strong> Chaque paire de caractères hex représente un caractère ASCII. Convertissez pour trouver le mot.</p></div>
    <div className="glass2 rounded-lg p-6" style={{boxShadow:'0 0 15px rgba(139,92,246,.3)'}}>
      <p className="ft text-xs uppercase tracking-[0.3em] text-violet-400 mb-3 text-center">Valeurs hexadécimales</p>
      <div className="flex flex-wrap justify-center gap-2">{hexVals.map((h,i)=>(<div key={i} className="bg-violet-950/60 rounded px-4 py-2 fm text-violet-200 text-xl font-bold border border-violet-500/30">{h}</div>))}</div>
    </div>
    <div className="glass rounded-lg p-4">
      <p className="ft text-xs uppercase tracking-[0.2em] text-violet-400 mb-2 text-center">Table de conversion</p>
      <div className="grid grid-cols-4 sm:grid-cols-7 gap-1 text-xs text-center">{[['A','41'],['B','42'],['C','43'],['D','44'],['E','45'],['F','46'],['G','47'],['H','48'],['I','49'],['J','4A'],['K','4B'],['L','4C'],['M','4D'],['N','4E'],['O','4F'],['P','50'],['Q','51'],['R','52'],['S','53'],['T','54'],['U','55'],['V','56'],['W','57'],['X','58'],['Y','59'],['Z','5A']].map(([l,v])=>(<div key={l} className="bg-violet-950/40 rounded px-1 py-1 border border-violet-500/20"><span className="text-violet-300 font-bold">{l}</span><span className="text-violet-500 ml-1">{v}</span></div>))}</div>
    </div>
    <AI v={a} ch={setA} sub={sub} ph="Le mot déchiffré..." er={e}/>
    <a href="https://www.rapidtables.com/convert/number/hex-to-ascii.html" target="_blank" rel="noopener" className="block text-center text-xs text-violet-500 underline">🔗 Convertisseur Hex → ASCII</a>
  </div>);
};

// ===== C16: QR CODE =====
const C16=({onS})=>{
  const[a,setA]=useState('');const[e,setE]=useState(false);
  const sub=()=>{if(norm(a)===CH[15].ans)onS();else{setE(true);setTimeout(()=>setE(false),500)}};
  return(<div className="space-y-5">
    <div className="glass rounded-lg p-4"><p className="text-teal-100 leading-relaxed"><strong className="text-teal-300">QR Code :</strong> Ce code 2D contient un message caché. Scannez-le avec l'appareil photo de votre téléphone ou un lecteur QR en ligne.</p></div>
    <div className="glass rounded-lg p-4 flex justify-center" style={{boxShadow:'0 0 15px rgba(20,184,166,.3)'}}>
      <div className="bg-white p-4 rounded-xl border-2 border-teal-400/50" style={{boxShadow:'0 0 20px rgba(20,184,166,.3)'}}><img src={'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=flag%3DMATRIX&color=0f766e&bgcolor=ffffff'} alt="QR Code" className="w-48 h-48 rounded" onError={e=>{e.target.alt='QR Code - utilisez le lien ci-dessous'}}/></div>
    </div>
    <div className="glass rounded-lg p-4"><p className="text-sm text-teal-200/70 text-center fm">Scannez avec votre téléphone ou uploadez l'image sur un lecteur QR en ligne. Le message contient un flag=...</p></div>
    <AI v={a} ch={setA} sub={sub} ph="Le mot après flag=..." er={e}/>
    <a href="https://webqr.com/" target="_blank" rel="noopener" className="block text-center text-xs text-teal-500 underline">🔗 Lecteur QR Code en ligne</a>
  </div>);
};

const CC=[C1,C2,C3,C4,C5,C6,C7,C8,C9,C10,C11,C12,C13,C14,C15,C16];

// ===== SESSION URL =====
const KEY=173;
const encS=d=>{const bm=d.reduce((a,v,i)=>a|(v?1<<i:0),0);return btoa(String(bm^KEY))};
const decS=s=>{try{const bm=parseInt(atob(s))^KEY;return Array.from({length:16},(_,i)=>Boolean(bm&(1<<i)))}catch(e){return Array(16).fill(false)}};
const updURL=d=>{const s=encS(d);const u=new URL(window.location);u.searchParams.set('s',s);window.history.replaceState({},'',u)};
const readURL=()=>{const p=new URLSearchParams(window.location.search);const s=p.get('s');return s?decS(s):Array(16).fill(false)};

// ===== APP =====
const App=()=>{
  const[v,setV]=useState('home');
  const[ci,setCI]=useState(0);
  const[done,setD]=useState(()=>readURL());
  const[flags,setF]=useState(()=>{const d=readURL();return d.reduce((a,v,i)=>{if(v)a.push(i);return a},[])});
  const[showLore,setLore]=useState(false);
  useEffect(()=>{window.scrollTo(0,0);setLore(false)},[v,ci]);
  const solve=()=>{const n=[...done];n[ci]=true;setD(n);updURL(n);if(!flags.includes(ci))setF([...flags,ci]);setV('hist')};
  const go=i=>{setCI(i);setV('ch')};
  const next=()=>{if(ci<15){setCI(ci+1);setV('ch')}else setV('win')};
  const cnt=done.filter(Boolean).length;

  if(v==='home')return(
    <div className="min-h-screen px-4 py-8 sm:py-12"><div className="max-w-md lg:max-w-2xl mx-auto fi">
      <div className="text-center mb-10">
        <div className="text-6xl sm:text-7xl mb-4 ns pulse">𓂀</div>
        <h1 className="ft text-2xl sm:text-3xl font-bold text-white mb-1 tracking-[0.2em] uppercase neon-shimmer">CRYPTOGRAPHIA</h1>
        <p className="text-cyan-400/60 fm text-sm tracking-widest">// 2500 ANS DE SECRETS //</p>
      </div>

      <div className="glass rounded-xl p-5 mb-6 border-glow-cyan">
        <div className="flex items-center justify-between mb-3"><span className="text-xs uppercase tracking-[0.2em] text-cyan-400 ft">Progression</span><span className="ft font-bold text-cyan-300 text-lg">{cnt}<span className="text-cyan-600">/16</span></span></div>
        <div className="h-2 bg-cyan-950 rounded-full overflow-hidden border border-cyan-800"><div className="h-full bg-gradient-to-r from-cyan-500 to-blue-500 transition-all duration-700" style={{width:`${cnt/16*100}%`}}/></div>
        {flags.length>0&&(<div className="mt-4 pt-4 border-t border-cyan-800/40"><p className="text-xs uppercase tracking-widest text-cyan-500 ft mb-2">Flags collectés</p><div className="flex flex-wrap gap-1.5">{flags.map(i=>(<span key={i} className="text-xs px-2 py-0.5 bg-cyan-950 text-cyan-300 rounded border border-cyan-500/30 fm tracking-wider">{CH[i].fl}</span>))}</div></div>)}
      </div>

      <div className="space-y-3">{CH.map((c,i)=>{const d=done[i];return(
        <button key={c.id} onClick={()=>go(i)} className="w-full text-left p-4 rounded-xl border transition-all glass active:scale-[0.98]" style={{borderColor:d?c.clr+'60':c.clr+'20',boxShadow:d?`0 0 12px ${c.clr}30`:'none'}}>
          <div className="flex items-center gap-3">
            <div className="w-12 h-12 rounded-full flex items-center justify-center text-2xl flex-shrink-0 ft border-2" style={{borderColor:d?c.clr+'60':'rgba(255,255,255,.3)',backgroundColor:d?c.clr+'20':'rgba(255,255,255,.08)',color:d?c.clr:'#ffffff'}}>{d?<Ic n="ck" s={24}/>:ROM[i]}</div>
            <div className="flex-1 min-w-0"><div className="flex items-center gap-2 mb-0.5"><span className="text-xs ft font-bold tracking-widest" style={{color:c.clr}}>{c.ep}</span><span className="text-xs text-gray-600">·</span><span className="text-xs text-gray-500 truncate">{c.cv}</span></div><div className="ft font-bold text-gray-200 truncate tracking-wide text-sm sm:text-base">{c.nm}</div></div>
            <div>{d?<span className="text-2xl ns">{c.ic}</span>:<Ic n="cr" s={20} c="text-gray-600"/>}</div>
          </div>
        </button>
      )})}</div>

      {cnt===16&&(<button onClick={()=>setV('win')} className="mt-6 w-full py-4 bg-gradient-to-r from-cyan-600 to-blue-700 text-white rounded-xl ft font-bold tracking-widest uppercase active:scale-[0.98] flex items-center justify-center gap-2 shadow-lg shadow-cyan-500/30 border border-cyan-400/30"><Ic n="tp" s={22}/> Épilogue</button>)}
      {cnt>0&&cnt<16&&(<button onClick={()=>setV('win')} className="mt-6 w-full py-3 glass text-cyan-400 rounded-xl border-2 border-cyan-500/30 ft text-xs uppercase tracking-widest active:scale-[0.98] flex items-center justify-center gap-2">🏆 Voir mes trésors ({cnt}/16)</button>)}

      <p className="text-center text-xs text-gray-700 mt-10 fm">CRYPTOGRAPHIA.v2 // MMXXVI</p>
    </div></div>
  );

  if(v==='ch'){const c=CH[ci];const Comp=CC[ci];return(
    <div className="min-h-screen px-4 py-6"><div className="max-w-md lg:max-w-2xl mx-auto fi">
      <div className="flex items-center justify-between mb-4">
        <button onClick={()=>setV('home')} className="text-cyan-500 flex items-center gap-1 text-sm ft uppercase tracking-widest active:text-cyan-300"><Ic n="cl" s={16}/> Retour</button>
        <button onClick={()=>setLore(true)} className="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs ft uppercase tracking-widest active:scale-95 border btn-glow" style={{color:c.clr,borderColor:c.clr,background:c.clr+'15','--gclr':c.clr+'80'}}>📜 Histoire</button>
      </div>
      <div className="glass rounded-xl border overflow-hidden mb-6" style={{borderColor:c.clr+'40',boxShadow:`0 0 30px ${c.clr}15`}}>
        <div className="relative p-6 overflow-hidden" style={{background:`linear-gradient(135deg, ${c.clr}15, transparent, ${c.clr}08)`}}>
          <div className="absolute top-0 right-0 text-9xl opacity-10 ns" style={{transform:'translate(20%,-20%)',color:c.clr}}>{c.ic}</div>
          <div className="relative"><div className="flex items-center justify-between mb-3"><span className="text-xs uppercase tracking-[0.3em] ft" style={{color:c.clr}}>Chapitre {ROM[ci]}</span><span className="text-xs ft text-gray-500 tracking-widest">{c.ep}</span></div><div className="text-5xl mb-3 ns">{c.ic}</div><h2 className="ft text-2xl sm:text-3xl font-bold mb-1 tracking-wide text-white">{c.nm}</h2><p className="text-gray-400">{c.cv}</p></div>
        </div>
        <div className="px-4 pt-4"><WikiImg title={c.wiki} alt={c.nm} clr={c.clr} icon={c.ic} lang={c.wikiLang||'en'} directUrl={c.imgUrl}/></div>
        <div className="p-4 sm:p-5"><Comp onS={solve}/></div>
      </div>
      {showLore&&<Modal ch={c} onClose={()=>setLore(false)}/>}
    </div></div>
  );}

  if(v==='hist'){const c=CH[ci];return(
    <div className="min-h-screen px-4 py-8"><div className="max-w-md lg:max-w-2xl mx-auto fi">
      <div className="text-center mb-6"><div className="inline-flex items-center justify-center w-24 h-24 rounded-full mb-4 sr border-4" style={{borderColor:c.clr,backgroundColor:c.clr+'20',boxShadow:`0 0 30px ${c.clr}60`}}><Ic n="ul" s={40} c="text-white"/></div><p className="ft text-xs uppercase tracking-[0.3em] glow-green text-green-400">Énigme résolue</p></div>
      <div className="glass rounded-xl p-6 mb-5" style={{borderColor:c.clr+'40'}}>
        <div className="text-center mb-4"><div className="text-5xl mb-3 ns">{c.ic}</div><h2 className="ft text-2xl font-bold text-white tracking-wide">{c.nm}</h2><p className="text-sm ft tracking-widest mt-1" style={{color:c.clr}}>{c.ep} · {c.cv.toUpperCase()}</p></div>
        <p className="text-gray-300 leading-relaxed italic">{c.hi}</p>
      </div>
      <div className="rounded-xl p-6 mb-6 border-2" style={{background:`linear-gradient(135deg, ${c.clr}10, #050510, ${c.clr}05)`,borderColor:c.clr+'60',boxShadow:`0 0 25px ${c.clr}30`}}>
        <div className="text-center"><p className="ft text-xs uppercase tracking-[0.3em] mb-3" style={{color:c.clr}}>Trésor découvert</p>
          <div className="bg-black/50 rounded-lg py-4 px-3 border mb-3" style={{borderColor:c.clr+'40'}}><p className="fm text-xs uppercase tracking-widest mb-2" style={{color:c.clr+'99'}}>FLAG</p><p className="text-2xl sm:text-3xl ft font-bold neon-shimmer tracking-[0.15em]">{c.fl}</p></div>
          <p className="italic text-gray-400 text-sm">{c.fm}</p>
        </div>
      </div>
      <div className="space-y-3">
        <button onClick={next} className="w-full py-4 bg-gradient-to-r from-cyan-600 to-blue-700 text-white rounded-xl ft tracking-widest uppercase text-sm active:scale-[0.98] flex items-center justify-center gap-2 shadow-lg shadow-cyan-500/20 border border-cyan-400/30">{ci<15?<>Énigme suivante <Ic n="cr" s={18}/></>:<>Épilogue <Ic n="tp" s={18}/></>}</button>
        <button onClick={()=>setV('win')} className="w-full py-3 bg-gradient-to-r from-yellow-600/160 to-amber-700/160 text-yellow-100 rounded-xl ft text-xs uppercase tracking-widest active:scale-[0.98] flex items-center justify-center gap-2 border border-yellow-500/30">🏆 Voir mes trésors ({cnt}/16)</button>
        <button onClick={()=>setV('home')} className="w-full py-3 glass text-gray-400 rounded-xl ft text-xs uppercase tracking-widest">Retour au sommaire</button>
      </div>
    </div></div>
  );}

  if(v==='win')return(
    <div className="min-h-screen px-4 py-10 flex items-center"><div className="max-w-md lg:max-w-2xl mx-auto text-center fi">
      <div className="text-7xl mb-6 ns pulse">🏆</div>
      <h1 className="ft text-3xl sm:text-4xl font-bold mb-3 tracking-[0.1em] neon-shimmer">{cnt===16?'MAÎTRE DES CODES':'PROGRESSION'}</h1>
      <div className="h-px bg-gradient-to-r from-transparent via-cyan-400 to-transparent w-32 mx-auto mb-4"></div>
      <p className="italic text-gray-400 mb-8">{cnt===16?'Tous les secrets ont été percés.':cnt+' flag'+(cnt>1?'s':'')+' sur 8 collecté'+(cnt>1?'s':'')+'.'}</p>
      <div className="glass rounded-xl border border-cyan-500/30 p-5 mb-6 text-left"><p className="ft text-xs uppercase tracking-[0.3em] text-cyan-400 mb-4 text-center">Trésors ({cnt}/16)</p><div className="space-y-2">{flags.map(i=>{const c=CH[i];return(<div key={c.id} className="flex items-center gap-3 bg-black/30 rounded-md p-2 border" style={{borderColor:c.clr+'30'}}><div className="w-10 h-10 rounded-full border flex items-center justify-center text-xl flex-shrink-0" style={{borderColor:c.clr+'60',color:c.clr}}>{c.ic}</div><div className="flex-1 min-w-0"><p className="text-xs ft tracking-wider" style={{color:c.clr}}>{c.ep}</p><p className="fm font-bold text-gray-200 tracking-wider truncate">{c.fl}</p></div></div>)})}{cnt<16&&<p className="text-center text-gray-600 italic text-sm mt-3">{16-cnt} énigme{16-cnt>1?'s':''} restante{16-cnt>1?'s':''}</p>}</div></div>
      <button onClick={()=>setV('home')} className="w-full py-4 bg-gradient-to-r from-cyan-600 to-blue-700 text-white rounded-xl ft font-bold uppercase tracking-widest active:scale-[0.98] shadow-lg shadow-cyan-500/30 border border-cyan-400/30">{cnt===16?'Recommencer':'Continuer'}</button>
    </div></div>
  );
  return null;
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
