/*

 * 
 * Answers are NOT stored in plaintext - only their SHA-256 hashes.
 * Think you can crack them? Here's what you need to know:
 *

 * 📚 LEARNING RESOURCES:
 * - SHA-256 implementation: crypto.subtle.digest()
 * - Rainbow tables & hash cracking

 * 
 * If you crack this, congrats! You've learned real pentesting skills.

const sha256 = async (message) => {
  const msgBuffer = new TextEncoder().encode(message);
  const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
};

const validateAnswer = async (input, expectedHash) => {
  const normalized = norm(input);
  const inputHash = await sha256(normalized);
  return inputHash === expectedHash;
};

const CH=[
  {id:9,ep:'1500 av.J-C',nm:'Le Chiffre Atbash',cv:'Hébreux',ic:'↔',ansHash:'487857bcc3181258953065f5d4c556061f639a8dc4e5987d655dca7754252ddf',fl:'INVERSION',fm:"Le principe fondamental de l'Atbash : inverser l'alphabet.",hi:"Inversez l'alphabet : A↔Z, B↔Y, C↔X...",clr:'#6366f1',mini:'🔄',wiki:'Dead_Sea_Scrolls',imgUrl:'https://josephkimiri.github.io/assets/img/blog/atbash.jpg',
    lore:"L'Atbash est l'un des plus anciens chiffrements connus, originaire de la tradition hébraïque. Son principe est d'une simplicité radicale : on inverse l'alphabet. La première lettre devient la dernière, la deuxième l'avant-dernière, et ainsi de suite.\n\nA devient Z, B devient Y, C devient X... Ce système est mentionné dans la Bible, notamment dans le Livre de Jérémie, où le mot « Sheshakh » (ששך) est un Atbash pour « Babel » (בבל).\n\nMalgré sa simplicité, l'Atbash a traversé les millénaires. Les kabbalistes l'utilisaient pour cacher des significations mystiques dans les textes sacrés. Certains groupes ésotériques l'emploient encore aujourd'hui.",
    en:{"nm": "Atbash Cipher", "cv": "Hebrews", "fm": "The fundamental principle of Atbash: reversing the alphabet.", "hi": "Reverse the alphabet: A<->Z, B<->Y, C<->X...", "lore": "Atbash is one of the oldest known ciphers, originating from the Hebrew tradition. Its principle is radically simple: reverse the alphabet. The first letter becomes the last, the second becomes the second-to-last, and so on.\n\nA becomes Z, B becomes Y, C becomes X... This system is mentioned in the Bible, notably in the Book of Jeremiah, where the word Sheshakh is an Atbash for Babel.\n\nDespite its simplicity, Atbash has crossed millennia. Kabbalists used it to hide mystical meanings in sacred texts. Some esoteric groups still use it today."}},
  {id:1,ep:'−500',nm:'La Scytale',cv:'Sparte',ic:'𓂀',ansHash:'6047bac3424269b9379a03258f3c57b1fa103daa9640819d41fa48e4034c23ed',fl:'LACEDEMONE',fm:"L'antique nom de Sparte.",hi:"Les généraux spartiates enroulaient une bande de cuir autour d'un bâton appelé scytale.",clr:'#00f0ff',
    mini:'🛡️',wiki:'Scytale',
    lore:"Au Ve siècle avant J.-C., Sparte dominait le Péloponnèse par la force de ses guerriers. Les éphores — magistrats suprêmes — devaient communiquer secrètement avec leurs généraux déployés au loin.\n\nIls inventèrent la scytale : une bande de cuir étroite enroulée en spirale autour d'un bâton cylindrique à section carrée parfaite. Le message s'écrivait horizontalement, puis la bande était déroulée pour être confiée au messager. Sans le bon bâton, impossible de lire quoi que ce soit.\n\nLe plus célèbre utilisateur de la scytale fut sans doute un roi spartiate légendaire, héros des Thermopyles, qui mena 300 guerriers face à l'Empire perse en 480 av. J.-C. Les messages chiffrés par scytale jouèrent un rôle crucial dans la coordination des forces grecques.\n\nLe nombre de faces visibles du bâton déterminait le chiffrement. Pour reconstituer le message, il fallait enrouler la bande sur un bâton identique et lire horizontalement.",
    en:{"nm": "The Scytale", "cv": "Sparta", "fm": "The ancient name of Sparta.", "hi": "Spartan generals wrapped a leather strip around a rod called a scytale.", "lore": "In the 5th century BC, Sparta dominated the Peloponnese through the strength of its warriors. The ephors — supreme magistrates — had to communicate secretly with their generals deployed afar.\n\nThey invented the scytale: a narrow leather strip wound in a spiral around a cylindrical rod with a perfect square section. The message was written horizontally, then the strip was unwound to be entrusted to the messenger. Without the right rod, it was impossible to read anything.\n\nThe most famous user of the scytale was undoubtedly a legendary Spartan king, hero of Thermopylae, who led 300 warriors against the Persian Empire in 480 BC. Messages encrypted by scytale played a crucial role in coordinating Greek forces.\n\nThe number of visible faces of the rod determined the encryption. To reconstruct the message, one had to wrap the strip around an identical rod and read horizontally."}},
  {id:3,ep:'−150',nm:'Le Carré de Polybe',cv:'Grèce',ic:'⊞',ansHash:'0917b13a9091915d54b6336f45909539cce452b3661b21f386418a257883b30a',fl:'TORCHES',fm:"Deux groupes de torches transmettaient les coordonnées.",hi:"Polybe inventa une grille 5×5 où chaque lettre est repérée par deux chiffres.",clr:'#00ff41',
    mini:'🔥',wiki:'Polybius_square',
    lore:"Polybe, historien grec du IIe siècle av. J.-C., inventa un système de communication à distance remarquable. Il disposa les 25 lettres de l'alphabet dans une grille carrée, où chaque lettre est identifiée par sa position : un premier chiffre pour la ligne, un second pour la colonne.\n\nPour transmettre à distance, Polybe utilisait des torches allumées sur les collines : un premier groupe indiquait la rangée, un second la colonne. Ce système permettait de communiquer la nuit sur de grandes distances, à une vitesse surprenante pour l'époque.\n\nDes siècles plus tard, les prisonniers de guerre adaptèrent cette méthode en tapant sur les murs de leurs cellules — le fameux « code des prisonniers ». Un prisonnier tapait d'abord le numéro de ligne, puis celui de colonne, pour chaque lettre du message.\n\nLa grille de Polybe est aussi à la base de nombreux chiffrements modernes. Sa simplicité est sa force : il suffit de connaître les coordonnées pour déchiffrer n'importe quel message.",
    en:{"nm": "Polybius Square", "cv": "Greece", "fm": "Two groups of torches transmitted the coordinates.", "hi": "Polybius invented a 5x5 grid where each letter is identified by two numbers.", "lore": "Polybius, a Greek historian of the 2nd century BC, invented a remarkable long-distance communication system. He arranged the 25 letters of the alphabet in a square grid, where each letter is identified by its position: a first number for the row, a second for the column.\n\nTo transmit at a distance, Polybius used lit torches on the hills: a first group indicated the row, a second the column. This system allowed communication at night over long distances, at a surprising speed for the time.\n\nCenturies later, prisoners of war adapted this method by tapping on their cell walls — the famous prisoners' code. A prisoner would first tap the row number, then the column number, for each letter of the message.\n\nThe Polybius grid is also the basis of many modern ciphers. Its simplicity is its strength: you only need to know the coordinates to decipher any message."}},
  {id:2,ep:'−50',nm:'Le Chiffre de César',cv:'Rome',ic:'♜',ansHash:'3be4c886bf4becab0baf4b5da40b2743f492424360bedf568cdcee37c58aa918',fl:'RUBICON',fm:"Le fleuve franchi par César.",hi:"César décalait chaque lettre selon une clé secrète.",clr:'#ff2d95',
    mini:'🏛️',wiki:'Caesar_cipher',
    lore:"Jules César, consul puis dictateur de Rome, utilisait un système de chiffrement d'une simplicité trompeuse. Chaque lettre de l'alphabet était remplacée par celle située quelques positions plus loin — un décalage si modeste qu'on pouvait le compter sur les doigts d'une main.\n\nSuétone rapporte que César l'utilisait pour sa correspondance privée. À une époque où la majorité de la population était illettrée, ce simple décalage suffisait à protéger les messages les plus sensibles.\n\nLes Romains notaient leurs nombres avec des lettres : I, V, X, L, C, D, M. Le décalage de César est souvent exprimé dans cette notation ancestrale.\n\nAprès sa conquête de la Gaule, César envoya au Sénat un message devenu légendaire — une phrase de victoire en trois mots latins, si concise et percutante qu'elle traversa les siècles. Quelques années plus tôt, il avait franchi un fleuve fameux, déclenchant la guerre civile qui transforma la République en Empire.",
    en:{"nm": "Caesar Cipher", "cv": "Rome", "fm": "The river crossed by Caesar.", "hi": "Caesar shifted each letter according to a secret key.", "lore": "Julius Caesar, consul then dictator of Rome, used a deceptively simple encryption system. Each letter of the alphabet was replaced by one located a few positions further — a shift so modest it could be counted on the fingers of one hand.\n\nSuetonius reports that Caesar used it for his private correspondence. At a time when most of the population was illiterate, this simple shift was enough to protect the most sensitive messages.\n\nThe Romans noted their numbers with letters: I, V, X, L, C, D, M. Caesar's shift is often expressed in this ancestral notation.\n\nAfter his conquest of Gaul, Caesar sent the Senate a message that became legendary — a victory phrase in three Latin words, so concise and striking that it crossed the centuries. A few years earlier, he had crossed a famous river, triggering the civil war that transformed the Republic into an Empire."}},
  {id:4,ep:'1586',nm:'Le Chiffre de Vigenère',cv:'France',ic:'⚜',ansHash:'87d9a5c0919de95ed19a65256700d031b25d37a048682a1fb3421a5818b7956f',fl:'INDECHIFFRABLE',fm:"Son surnom pendant trois siècles.",hi:"Une clé secrète décale différemment chaque lettre.",clr:'#ffd700',
    mini:'📜',wiki:'Vigen%C3%A8re_cipher',
    lore:"Blaise de Vigenère, diplomate français à la cour d'Henri III, perfectionna en 1586 un système polyalphabétique. Contrairement au chiffre de César (décalage fixe), Vigenère utilise une clé secrète qui modifie chaque lettre différemment.\n\nLa clé est un mot court et mémorable — souvent un mot de quatre lettres évoquant la puissance ou la noblesse. On raconte que les diplomates français choisissaient des noms d'animaux majestueux, emblèmes du pouvoir royal. Cette clé se répète cycliquement sur toute la longueur du message.\n\nPour chiffrer, on additionne chaque lettre du texte avec la lettre correspondante de la clé (A=0, B=1...). Pour déchiffrer, on soustrait.\n\nPendant 300 ans, ce chiffre fut surnommé « le chiffre indéchiffrable ». Il fallut attendre le XIXe siècle pour que Charles Babbage et Friedrich Kasiski découvrent comment le briser en analysant les répétitions.",
    en:{"nm": "Vigenère Cipher", "cv": "France", "fm": "Its nickname for three centuries.", "hi": "A secret key shifts each letter differently.", "lore": "Blaise de Vigenère, French diplomat at the court of Henri III, perfected a polyalphabetic system in 1586. Unlike Caesar's cipher (fixed shift), Vigenère uses a secret key that modifies each letter differently.\n\nThe key is a short, memorable word — often a four-letter word evoking power or nobility. It is said that French diplomats chose names of majestic animals, emblems of royal power. This key repeats cyclically over the entire length of the message.\n\nTo encrypt, each letter of the text is added to the corresponding letter of the key (A=0, B=1...). To decrypt, subtract.\n\nFor 300 years, this cipher was nicknamed the indecipherable cipher. It took until the 19th century for Charles Babbage and Friedrich Kasiski to discover how to break it by analyzing repetitions."}},
  {id:5,ep:'1844',nm:'Le Rail Fence',cv:'États-Unis',ic:'⚡',ansHash:'80b3036900d5ba63ee8860dc78176a34e80bdb0849000c83d1d2aace256a3918',fl:'MORSE',fm:"Morse révolutionna la communication.",hi:"Le Rail Fence dispose les lettres en zigzag sur plusieurs rails.",clr:'#ff6b00',
    mini:'⚡',wiki:'Morse_code',
    lore:"Au milieu du XIXe siècle, la révolution industrielle transformait les communications. Le chiffre Rail Fence disposait les lettres en zigzag sur plusieurs lignes horizontales — les « rails ». Le nombre de rails, toujours petit, constituait la clé secrète.\n\nPour chiffrer, on écrit le message en zigzag descendant puis remontant. On transmet ensuite en lisant chaque rail de gauche à droite. Pour décoder, il faut reconnaître le nombre de rails utilisé et reconstituer le zigzag.\n\nEn 1844, Samuel Morse envoya le premier message télégraphique. Son code — des points et des traits attribués à chaque lettre de l'alphabet — révolutionna la communication mondiale. Ce système permettait de transmettre un message en quelques minutes là où un cavalier mettait des jours.\n\nLe télégraphe rendit possible la transmission instantanée de messages chiffrés. Un nombre pouvait être transmis en épelant son nom lettre par lettre dans le code de Morse, ajoutant une couche supplémentaire de complexité.",
    en:{"nm": "Rail Fence", "cv": "United States", "fm": "Morse revolutionized communication.", "hi": "Rail Fence arranges letters in a zigzag on several rails.", "lore": "In the mid-19th century, the industrial revolution was transforming communications. The Rail Fence cipher arranged letters in a zigzag on several horizontal lines — the rails. The number of rails, always small, constituted the secret key.\n\nTo encrypt, the message is written in a descending then ascending zigzag. It is then transmitted by reading each rail from left to right. To decode, one must recognize the number of rails used and reconstruct the zigzag.\n\nIn 1844, Samuel Morse sent the first telegraphic message. His code — dots and dashes assigned to each letter of the alphabet — revolutionized global communication. This system allowed a message to be transmitted in minutes where a rider would take days.\n\nThe telegraph made possible the instant transmission of encrypted messages. A number could be transmitted by spelling its name letter by letter in Morse code, adding an additional layer of complexity."}},
  {id:6,ep:'1854',nm:'Le Chiffre de Playfair',cv:'Royaume-Uni',ic:'♛',ansHash:'07a9d7b4a9a23915a61bc89bb0357bf47b348cf4174eb965bb1df8fbfa18b0b5',fl:'WHEATSTONE',fm:"Charles Wheatstone inventa le chiffre.",hi:"Utilisé par l'armée britannique pendant les guerres coloniales.",clr:'#a855f7',
    mini:'👑',wiki:'Playfair_cipher',
    lore:"En 1854, Charles Wheatstone inventa un système utilisant une grille de 5×5 cases remplie selon un mot-clé. Bien que Wheatstone en soit l'inventeur, c'est Lord Playfair qui en fit la promotion — d'où le nom.\n\nL'armée britannique l'adopta pendant la Guerre des Boers et la Première Guerre mondiale. Les officiers victoriens, férus de culture classique, appréciaient les langues anciennes pour ajouter de l'obscurité à leurs messages.\n\nIl n'était pas rare que les positions dans la grille soient notées non pas en chiffres arabes ordinaires, mais dans un système de numération hérité de l'Antiquité méditerranéenne. Les premières lettres d'un alphabet très ancien — celui qui donna naissance au nôtre — servaient alors de coordonnées, chacune représentant un chiffre en partant de zéro.\n\nCette pratique ajoutait une étape de déchiffrement supplémentaire : il fallait d'abord traduire ces symboles anciens en nombres avant de pouvoir consulter la grille.",
    en:{"nm": "Playfair Cipher", "cv": "United Kingdom", "fm": "Charles Wheatstone invented the cipher.", "hi": "Used by the British army during colonial wars.", "lore": "In 1854, Charles Wheatstone invented a system using a 5x5 grid filled according to a keyword. Although Wheatstone was the inventor, it was Lord Playfair who promoted it — hence the name.\n\nThe British army adopted it during the Boer War and World War I. Victorian officers, steeped in classical culture, appreciated ancient languages to add obscurity to their messages.\n\nIt was not uncommon for positions in the grid to be noted not in ordinary Arabic numerals, but in a numbering system inherited from Mediterranean antiquity. The first letters of a very ancient alphabet — the one that gave birth to ours — then served as coordinates, each representing a number starting from zero.\n\nThis practice added an additional decryption step: one first had to translate these ancient symbols into numbers before being able to consult the grid."}},
  {id:14,ep:'1917',nm:'Le Chiffre XOR',cv:'Cryptographie',ic:'⊕',ansHash:'5ca24005b740717ba4f3f6bc48a230700e68c2a4b11ecedb96f169f4efaf1f21',fl:'BIT',fm:"L'opération fondamentale de la cryptographie moderne.",hi:"XOR : si les bits sont identiques → 0, s'ils sont différents → 1.",clr:'#3b82f6',mini:'🔢',wiki:'XOR_cipher',imgUrl:'https://fabricenativel.github.io/Terminale/images/C15/xor1.png',
    lore:"L'opération XOR (OU exclusif) est le cœur de la cryptographie moderne. Son principe : comparer deux bits. S'ils sont identiques (0⊕0 ou 1⊕1), le résultat est 0. S'ils sont différents (0⊕1 ou 1⊕0), le résultat est 1.\n\nPour chiffrer, on XOR chaque octet du message avec un octet de la clé. Pour déchiffrer, on applique exactement la même opération — XOR est sa propre inverse.\n\nAvec des caractères ASCII : on convertit chaque lettre en nombre, on XOR avec la clé numérique, et on reconvertit en lettre. Une opération simple mais qui, combinée à des clés aléatoires suffisamment longues, produit un chiffrement incassable (le « one-time pad »).",
    en:{"nm": "XOR Cipher", "cv": "Cryptography", "fm": "The fundamental operation of modern cryptography.", "hi": "XOR: if bits are identical -> 0, if different -> 1.", "lore": "The XOR (exclusive OR) operation is the heart of modern cryptography. Its principle: compare two bits. If they are identical (0 XOR 0 or 1 XOR 1), the result is 0. If they are different (0 XOR 1 or 1 XOR 0), the result is 1.\n\nTo encrypt, XOR each byte of the message with a byte of the key. To decrypt, apply exactly the same operation — XOR is its own inverse.\n\nWith ASCII characters: convert each letter to a number, XOR with the numeric key, and convert back to a letter. A simple operation but which, combined with sufficiently long random keys, produces unbreakable encryption (the one-time pad)."}},
  {id:7,ep:'1940',nm:'Enigma',cv:'Bletchley Park',ic:'⚙',ansHash:'b6b8d78626a4478839759e467ff1f579bf06739c1637fdd83705fe071a610a0e',fl:'TURING',fm:"Turing brisa Enigma et écourta la guerre.",hi:"La machine Enigma chiffrait avec 158 millions de millions de combinaisons.",clr:'#ef4444',
    mini:'⚙',wiki:'Enigma_machine',
    lore:"La machine Enigma, utilisée par l'Allemagne nazie, possédait trois rotors mécaniques. Chaque rotor appliquait un décalage distinct à la lettre qu'il traitait. Les positions étaient changées quotidiennement selon un carnet de codes.\n\nÀ Bletchley Park, Alan Turing et son équipe analysèrent les habitudes de l'ennemi. Les opérateurs allemands ne choisissaient pas leurs positions au hasard : ils privilégiaient certaines catégories de nombres — une préférence mathématique qui fut leur perte.\n\nLa méthode de Turing reposait sur les « cribs » — des fragments de texte en clair qu'on devinait présents dans le message. Les transmissions interceptées contenaient presque toujours des mots courts et prévisibles liés au contexte du conflit mondial.\n\nGrâce à la « Bombe » — machine électromécanique de son invention — Turing réduisit l'espace des possibles. En combinant les contraintes connues sur chaque rotor, le nombre de combinaisons à tester devenait humainement gérable. On estime qu'il écourta la guerre de 2 à 4 ans.",
    en:{"nm": "Enigma", "cv": "Bletchley Park", "fm": "Turing broke Enigma and shortened the war.", "hi": "The Enigma machine encrypted with 158 quintillion combinations.", "lore": "The Enigma machine, used by Nazi Germany, had three mechanical rotors. Each rotor applied a distinct shift to the letter it processed. Positions were changed daily according to a code book.\n\nAt Bletchley Park, Alan Turing and his team analyzed enemy habits. German operators did not choose their positions at random: they favored certain categories of numbers — a mathematical preference that was their downfall.\n\nTuring's method relied on cribs — fragments of plaintext guessed to be present in the message. Intercepted transmissions almost always contained short, predictable words related to the context of the global conflict.\n\nThanks to the Bombe — an electromechanical machine of his invention — Turing reduced the space of possibilities. By combining known constraints on each rotor, the number of combinations to test became humanly manageable. It is estimated that he shortened the war by 2 to 4 years."}},
  {id:15,ep:'1960',nm:'L\'Hexadécimal',cv:'Informatique',ic:'#️⃣',ansHash:'ab968dba0c8f21c3d3c8ffe44b4a4576119edc7fd98d84aaf0f520c326bba394',fl:'BYTE',fm:"Base 16 : le langage des machines.",hi:"Chaque paire de caractères hex représente un octet ASCII.",clr:'#8b5cf6',mini:'💻',wiki:'Hexadecimal',imgUrl:'https://www.datanovia.com/en/wp-content/uploads/dn-tutorials/ggplot2/images/hextable-hexadecimal-color-chart.png',
    lore:"L'hexadécimal (base 16) utilise les chiffres 0-9 et les lettres A-F pour représenter les valeurs de 0 à 15. Deux chiffres hexadécimaux forment un octet (0 à 255), suffisant pour encoder un caractère ASCII.\n\nLes informaticiens préfèrent l'hexadécimal au binaire car il est plus compact : 8 chiffres binaires = 2 chiffres hex. Les adresses mémoire, les couleurs web (#FF0000 = rouge), les analyses forensiques — tout utilise l'hexadécimal.\n\nPour convertir de l'hex en texte : prenez chaque paire de caractères, trouvez sa valeur décimale, puis le caractère ASCII correspondant. Par exemple, 41 hex = 65 décimal = lettre A.",
    en:{"nm": "Hexadecimal", "cv": "Computing", "fm": "Base 16: the language of machines.", "hi": "Each pair of hex characters represents an ASCII byte.", "lore": "Hexadecimal (base 16) uses digits 0-9 and letters A-F to represent values from 0 to 15. Two hexadecimal digits form a byte (0 to 255), sufficient to encode an ASCII character.\n\nComputer scientists prefer hexadecimal to binary because it is more compact: 8 binary digits = 2 hex digits. Memory addresses, web colors (#FF0000 = red), forensic analyses — everything uses hexadecimal.\n\nTo convert from hex to text: take each pair of characters, find its decimal value, then the corresponding ASCII character. For example, 41 hex = 65 decimal = letter A."}},
  {id:10,ep:'1963',nm:'Le Code Binaire',cv:'Informatique',ic:'💾',ansHash:'064866d6167ab12bacb2637bfe8c809372f3069fd075e1ccb3dd5425d364d137',fl:'OCTET',fm:"8 bits forment un octet, un octet forme un caractère.",hi:"Chaque lettre est encodée en 8 bits (0 et 1).",clr:'#10b981',mini:'🖥️',wiki:'ASCII',imgUrl:'https://nicolaskaplan.fr/blog/wp-content/uploads/2017/04/binary-computer-code-repeating-vector-background-illustration-continuous-pattern-left-right-up-and-down_135022250.jpeg',
    lore:"En 1963, le standard ASCII (American Standard Code for Information Interchange) fut adopté. Chaque caractère — lettre, chiffre, symbole — reçut un numéro unique de 0 à 127, encodé en 7 puis 8 bits (un octet).\n\nLa lettre A vaut 65, B vaut 66... En binaire, chaque lettre devient une suite de 8 chiffres : des 0 et des 1. Par exemple, A = 01000001.\n\nCe système est le fondement de toute l'informatique moderne. Chaque fichier, chaque message, chaque image que vous voyez sur un écran est au fond une immense suite de 0 et de 1, organisée en paquets de huit.",
    en:{"nm": "Binary Code", "cv": "Computing", "fm": "8 bits form a byte, a byte forms a character.", "hi": "Each letter is encoded in 8 bits (0 and 1).", "lore": "In 1963, the ASCII (American Standard Code for Information Interchange) standard was adopted. Each character — letter, number, symbol — received a unique number from 0 to 127, encoded in 7 then 8 bits (one byte).\n\nThe letter A is 65, B is 66... In binary, each letter becomes a sequence of 8 digits: 0s and 1s. For example, A = 01000001.\n\nThis system is the foundation of all modern computing. Every file, every message, every image you see on a screen is fundamentally a huge sequence of 0s and 1s, organized in packets of eight."}},
  {id:11,ep:'1980',nm:'Le ROT13',cv:'Internet',ic:'🔄',ansHash:'0c21e780658ddc0e487c61fb424244db69d7b8fc23bd0ee9f4e1c5f8a7a8c4b5',fl:'USENET',fm:"Le réseau Usenet popularisa ce chiffrement trivial.",hi:"Décalez chaque lettre de 13 positions dans l'alphabet.",clr:'#f59e0b',mini:'🌐',wiki:'ROT13',imgUrl:'https://miro.medium.com/v2/resize:fit:594/format:webp/0*m3VShx1oxynBnACy.jpeg',
    lore:"Au début des années 1980, le réseau Usenet — ancêtre des forums — avait un problème : comment partager des spoilers ou des blagues offensantes sans choquer ceux qui ne veulent pas les lire ?\n\nLa solution : ROT13, un chiffre de César avec un décalage de 13. Sa particularité unique : appliquer ROT13 deux fois redonne le texte original, car l'alphabet a 26 lettres et 13 est exactement la moitié.\n\nROT13 n'est pas un vrai chiffrement — c'est un « rideau » volontaire. Quiconque connaît ROT13 peut le décoder instantanément. Mais c'est devenu une tradition sur Internet et un terme de la culture hacker.",
    en:{"nm": "ROT13", "cv": "Internet", "fm": "The Usenet network popularized this trivial cipher.", "hi": "Shift each letter 13 positions in the alphabet.", "lore": "In the early 1980s, the Usenet network — ancestor of forums — had a problem: how to share spoilers or offensive jokes without shocking those who don't want to read them?\n\nThe solution: ROT13, a Caesar cipher with a shift of 13. Its unique feature: applying ROT13 twice gives back the original text, because the alphabet has 26 letters and 13 is exactly half.\n\nROT13 is not a real encryption — it's a voluntary curtain. Anyone who knows ROT13 can decode it instantly. But it has become an Internet tradition and a term of hacker culture."}},
  {id:8,ep:'1985',nm:'Stéganographie',cv:'Internet',ic:'◉',ansHash:'03f65a90b780528da96b69e5a344589bbb6a0066671052fcc8ec491041768538',fl:'PIXEL',fm:"Des messages cachés dans les pixels.",hi:"Un message caché dans les données brutes d'une image.",clr:'#06b6d4',
    mini:'💻',wiki:'Steganography',
    lore:"Bien que l'idée remonte à l'Antiquité (Hérodote rapporte des messages tatoués sur le crâne d'esclaves), la stéganographie moderne naît en 1985 avec les travaux de Gustavus Simmons. Du grec stéganos (« couvert ») et graphein (« écrire »), elle cache l'existence même du message. Contrairement au chiffrement qui rend illisible, la stéganographie dissimule le secret dans un support anodin — une image, un fichier audio, une vidéo.\n\nDans le monde numérique, chaque fichier image est composé de millions d'octets. Un éditeur hexadécimal révèle ces données brutes : des valeurs de 00 à FF qui encodent les pixels, les métadonnées, la structure du fichier.\n\nLa technique la plus élémentaire consiste à glisser du texte là où personne ne regarde : après que toutes les données légitimes du fichier se terminent. L'image s'affiche parfaitement — mais un observateur attentif, armé du bon outil, découvrira que le fichier contient plus qu'il n'y paraît.\n\nDes techniques plus sophistiquées modifient les bits les moins significatifs des pixels (LSB). L'œil humain ne perçoit pas la différence, mais les données sont bien là, dissimulées dans le bruit numérique.",
    en:{"nm": "Steganography", "cv": "Internet", "fm": "Messages hidden in pixels.", "hi": "A message hidden in the raw data of an image.", "lore": "Although the idea dates back to Antiquity (Herodotus reports messages tattooed on slaves' scalps), modern steganography was born in 1985 with the work of Gustavus Simmons. From the Greek steganos (covered) and graphein (to write), it hides the very existence of the message. Unlike encryption which makes it unreadable, steganography conceals the secret in an innocuous medium — an image, an audio file, a video.\n\nIn the digital world, each image file is composed of millions of bytes. A hex editor reveals this raw data: values from 00 to FF that encode pixels, metadata, file structure.\n\nThe most basic technique is to slip text where no one looks: after all legitimate file data ends. The image displays perfectly — but an attentive observer, armed with the right tool, will discover that the file contains more than it seems.\n\nMore sophisticated techniques modify the least significant bits of pixels (LSB). The human eye does not perceive the difference, but the data is there, hidden in the digital noise."}},
  {id:12,ep:'1987',nm:'Le Base64',cv:'Web',ic:'📧',ansHash:'8b325792e51e8dd4fda4558fdc763c49893a19ffd1fc0610138ff666df2c6609',fl:'MIME',fm:"Le format MIME utilise Base64 pour les pièces jointes email.",hi:"Un encodage qui transforme des données binaires en texte lisible.",clr:'#ec4899',mini:'📨',wiki:'Base64',wikiLang:'fr',
    lore:"Base64 n'est pas un chiffrement — c'est un encodage. Il transforme n'importe quelles données binaires en une suite de 64 caractères « sûrs » : A-Z, a-z, 0-9, + et /.\n\nInventé pour les emails (norme MIME, 1987), il permet d'envoyer des fichiers binaires (images, PDF) à travers des protocoles qui n'acceptent que du texte. Chaque groupe de 3 octets est converti en 4 caractères Base64.\n\nOn reconnaît facilement du Base64 : des chaînes de lettres et chiffres mélangés, souvent terminées par un ou deux signes =. Pour le décoder, un simple outil en ligne suffit.",
    en:{"nm": "Base64", "cv": "Web", "fm": "The MIME format uses Base64 for email attachments.", "hi": "An encoding that transforms binary data into readable text.", "lore": "Base64 is not encryption — it's an encoding. It transforms any binary data into a sequence of 64 safe characters: A-Z, a-z, 0-9, + and /.\n\nInvented for emails (MIME standard, 1987), it allows sending binary files (images, PDFs) through protocols that only accept text. Each group of 3 bytes is converted to 4 Base64 characters.\n\nBase64 is easy to recognize: strings of mixed letters and numbers, often ending with one or two = signs. To decode it, a simple online tool is enough."}},
  {id:13,ep:'1991',nm:'Le Hash MD5',cv:'Sécurité',ic:'🔒',ansHash:'9f98293f86ae4df997e7cc340df5fb32e740db53f234dc14b71db00fa338b338',fl:'HASH',fm:"Une empreinte unique et irréversible.",hi:"Un hash transforme un texte en empreinte fixe. Impossible à inverser... sauf avec une liste de mots.",clr:'#dc2626',mini:'🔐',wiki:'MD5',imgUrl:'https://upload.wikimedia.org/wikipedia/commons/thumb/2/2b/Cryptographic_Hash_Function.svg/500px-Cryptographic_Hash_Function.svg.png',
    lore:"MD5 (Message-Digest Algorithm 5), créé par Ronald Rivest en 1991, produit une empreinte de 128 bits (32 caractères hexadécimaux) à partir de n'importe quelle donnée. C'est une fonction à sens unique : on ne peut pas retrouver le message original à partir du hash.\n\nMais il existe une faille : les « rainbow tables ». Ce sont d'immenses dictionnaires précalculés qui associent des millions de mots à leur hash MD5. Si votre mot de passe est un mot courant, son hash est probablement dans une rainbow table.\n\nC'est pourquoi MD5 est considéré comme cassé pour la sécurité. Les systèmes modernes utilisent SHA-256 ou bcrypt. Mais pour ce défi, votre mission est de jouer le rôle d'un attaquant : retrouver le mot original à partir de son hash.",
    en:{"nm": "MD5 Hash", "cv": "Security", "fm": "A unique and irreversible fingerprint.", "hi": "A hash transforms text into a fixed fingerprint. Impossible to reverse... except with a word list.", "lore": "MD5 (Message-Digest Algorithm 5), created by Ronald Rivest in 1991, produces a 128-bit fingerprint (32 hexadecimal characters) from any data. It's a one-way function: you can't retrieve the original message from the hash.\n\nBut there's a flaw: rainbow tables. These are huge pre-calculated dictionaries that associate millions of words with their MD5 hash. If your password is a common word, its hash is probably in a rainbow table.\n\nThis is why MD5 is considered broken for security. Modern systems use SHA-256 or bcrypt. But for this challenge, your mission is to play the role of an attacker: find the original word from its hash."}},
  {id:16,ep:'1994',nm:'Le QR Code',cv:'Japon',ic:'📱',ansHash:'0bd9634ad89c32e05ae13463dc47a21123dab32114e876817bb876b61fbff0f2',fl:'DENSO',fm:"Denso Wave inventa le QR Code pour l'industrie automobile.",hi:"Un code 2D qui stocke des données dans un motif de carrés noirs et blancs.",clr:'#14b8a6',mini:'📲',wiki:'Denso',
    lore:"En 1994, Masahiro Hara, ingénieur chez Denso Wave (filiale de Toyota), créa le QR Code (Quick Response Code) pour suivre les pièces automobiles dans les usines japonaises.\n\nContrairement au code-barres classique (1D), le QR Code stocke des données en deux dimensions — horizontalement et verticalement. Il peut contenir jusqu'à 7 089 chiffres ou 4 296 caractères.\n\nLes trois grands carrés dans les coins permettent au scanner de déterminer l'orientation. Le reste du motif encode les données avec correction d'erreur : même endommagé à 30%, un QR Code reste lisible.\n\nAujourd'hui omniprésent (menus, billets, paiements), le QR Code est aussi utilisé en stéganographie : on peut y cacher des messages que seul un scanner révèlera.",
    en:{"nm": "QR Code", "cv": "Japan", "fm": "Denso Wave invented the QR Code for the automotive industry.", "hi": "A 2D code that stores data in a pattern of black and white squares.", "lore": "In 1994, Masahiro Hara, engineer at Denso Wave (Toyota subsidiary), created the QR Code (Quick Response Code) to track automotive parts in Japanese factories.\n\nUnlike the classic barcode (1D), the QR Code stores data in two dimensions — horizontally and vertically. It can contain up to 7,089 digits or 4,296 characters.\n\nThe three large squares in the corners allow the scanner to determine orientation. The rest of the pattern encodes data with error correction: even damaged up to 30%, a QR Code remains readable.\n\nToday ubiquitous (menus, tickets, payments), the QR Code is also used in steganography: messages can be hidden that only a scanner will reveal."}}
];

// Wikipedia image component
const WikiImg=({title,alt,clr,icon,lang='en',directUrl})=>{
  const[src,setSrc]=useState(directUrl||null);
  const[done,setDone]=useState(!!directUrl);
  useEffect(()=>{
    if(directUrl){setSrc(directUrl);setDone(true);return}
    setDone(false);setSrc(null);
    fetch('https://'+lang+'.wikipedia.org/w/api.php?action=query&titles='+title+'&prop=pageimages&format=json&pithumbsize=600&origin=*')
      .then(r=>r.json())
      .then(d=>{
        const p=Object.values(d.query.pages)[0];
        if(p&&p.thumbnail){setSrc(p.thumbnail.source);setDone(true)}
        else{
          fetch('https://'+lang+'.wikipedia.org/api/rest_v1/page/summary/'+title)
            .then(r=>r.json())
            .then(d2=>{if(d2.thumbnail)setSrc(d2.thumbnail.source);setDone(true)})
            .catch(()=>setDone(true))
        }
      })
      .catch(()=>setDone(true));
  },[title]);
  if(!done)return null;
  if(src)return(<div className="rounded-lg overflow-hidden border" style={{borderColor:clr+'30'}}>
    <img src={src} alt={alt} className="w-full object-contain" style={{maxHeight:'220px',filter:'brightness(0.85) contrast(1.1) saturate(0.85)',background:'rgba(0,0,0,.3)'}} onError={e=>{e.target.parentElement.style.display='none'}}/>
  </div>);
  return(<div className="rounded-lg overflow-hidden border h-32 flex items-center justify-center" style={{borderColor:clr+'30',background:'linear-gradient(135deg, '+clr+'15, rgba(0,0,0,.4), '+clr+'10)'}}>
    <div className="text-center"><div className="text-6xl mb-1 ns" style={{filter:'drop-shadow(0 0 12px '+clr+')'}}>{icon}</div><p className="ft text-xs uppercase tracking-widest" style={{color:clr+'90'}}>{alt}</p></div>

const md5Real = (() => {

const decS=s=>{try{const bm=parseInt(atob(s))^KEY;return Array.from({length:16},(_,i)=>Boolean(bm&(1<<i)))}catch(e){return Array(16).fill(false)}};
const updURL=d=>{const s=encS(d);const u=new URL(window.location);u.searchParams.set('s',s);window.history.replaceState({},'',u)};
const readURL=()=>{const p=new URLSearchParams(window.location.search);const s=p.get('s');return s?decS(s):Array(16).fill(false)};

        <button onClick={()=>setLore(true)} className="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs ft uppercase tracking-widest active:scale-95 border btn-glow" style={{color:c.clr,borderColor:c.clr,background:c.clr+'15','--gclr':c.clr+'80'}}>📜 {tr(lang,"history","Histoire")}</button>
      </div>
      <div className="glass rounded-xl border overflow-hidden mb-6" style={{borderColor:c.clr+'40',boxShadow:`0 0 30px ${c.clr}15`}}>
        <div className="relative p-6 overflow-hidden" style={{background:`linear-gradient(135deg, ${c.clr}15, transparent, ${c.clr}08)`}}>
          <div className="absolute top-0 right-0 text-9xl opacity-10 ns" style={{transform:'translate(20%,-20%)',color:c.clr}}>{c.ic}</div>
          <div className="relative"><div className="flex items-center justify-between mb-3"><span className="text-xs uppercase tracking-[0.3em] ft" style={{color:c.clr}}>{tr(lang,"chapterPrefix","Chapitre")} {ROM[ci]}</span><span className="text-xs ft text-gray-500 tracking-widest">{c.ep}</span></div><div className="text-5xl mb-3 ns">{c.ic}</div><h2 className="ft text-2xl sm:text-3xl font-bold mb-1 tracking-wide text-white">{cn(c,lang)}</h2><p className="text-gray-400">{cc(c,lang)}</p></div>
        </div>
        <div className="px-4 pt-4"><WikiImg title={c.wiki} alt={c.nm} clr={c.clr} icon={c.ic} lang={c.wikiLang||'en'} directUrl={c.imgUrl}/></div>
        <div className="p-4 sm:p-5"><Comp onS={solve}/></div>
      </div>
      {showLore&&<Modal ch={c} lang={lang} onClose={()=>setLore(false)}/>}
    </div></div></LangContext.Provider>
  );}

  if(v==='hist'){const c=CH[ci];return(
    <LangContext.Provider value={lang}>
    <div className="min-h-screen px-4 py-8"><div className="max-w-md lg:max-w-2xl mx-auto fi">
      <div className="text-center mb-6"><div className="inline-flex items-center justify-center w-24 h-24 rounded-full mb-4 sr border-4" style={{borderColor:c.clr,backgroundColor:c.clr+'20',boxShadow:`0 0 30px ${c.clr}60`}}><Ic n="ul" s={40} c="text-white"/></div><p className="ft text-xs uppercase tracking-[0.3em] glow-green text-green-400">{tr(lang,"puzzleSolved","Énigme résolue")}</p></div>
      <div className="glass rounded-xl p-6 mb-5" style={{borderColor:c.clr+'40'}}>
        <div className="text-center mb-4"><div className="text-5xl mb-3 ns">{c.ic}</div><h2 className="ft text-2xl font-bold text-white tracking-wide">{cn(c,lang)}</h2><p className="text-sm ft tracking-widest mt-1" style={{color:c.clr}}>{c.ep} · {cc(c,lang).toUpperCase()}</p></div>
        <p className="text-gray-300 leading-relaxed italic">{ch_(c,lang)}</p>
      </div>
      <div className="rounded-xl p-6 mb-6 border-2" style={{background:`linear-gradient(135deg, ${c.clr}10, #050510, ${c.clr}05)`,borderColor:c.clr+'60',boxShadow:`0 0 25px ${c.clr}30`}}>
        <div className="text-center"><p className="ft text-xs uppercase tracking-[0.3em] mb-3" style={{color:c.clr}}>{tr(lang,"treasureDiscovered","Trésor découvert")}</p>
          <div className="bg-black/50 rounded-lg py-4 px-3 border mb-3" style={{borderColor:c.clr+'40'}}><p className="fm text-xs uppercase tracking-widest mb-2" style={{color:c.clr+'99'}}>FLAG</p><p className="text-2xl sm:text-3xl ft font-bold neon-shimmer tracking-[0.15em]">{c.fl}</p></div>
          <p className="italic text-gray-400 text-sm">{cf(c,lang)}</p>
        </div>
      </div>
      <div className="space-y-3">
        <button onClick={next} className="w-full py-4 bg-gradient-to-r from-cyan-600 to-blue-700 text-white rounded-xl ft tracking-widest uppercase text-sm active:scale-[0.98] flex items-center justify-center gap-2 shadow-lg shadow-cyan-500/20 border border-cyan-400/30">{ci<15?<>{tr(lang,"nextPuzzle","Énigme suivante")} <Ic n="cr" s={18}/></>:<>{tr(lang,"epilogue","Épilogue")} <Ic n="tp" s={18}/></>}</button>
        <button onClick={()=>setV('win')} className="w-full py-3 bg-gradient-to-r from-yellow-600/160 to-amber-700/160 text-yellow-100 rounded-xl ft text-xs uppercase tracking-widest active:scale-[0.98] flex items-center justify-center gap-2 border border-yellow-500/30">🏆 {tr(lang,"viewTreasures","Voir mes trésors")} ({cnt}/16)</button>
        <button onClick={()=>setV('home')} className="w-full py-3 glass text-gray-400 rounded-xl ft text-xs uppercase tracking-widest">{tr(lang,'backToSummary','Retour au sommaire')}</button>
      </div>
    </div></div></LangContext.Provider>
  );}

  if(v==='win')return(
    <LangContext.Provider value={lang}>
    <div className="min-h-screen px-4 py-10 flex items-center"><div className="max-w-md lg:max-w-2xl mx-auto text-center fi">
      <div className="text-7xl mb-6 ns pulse">🏆</div>
      <h1 className="ft text-3xl sm:text-4xl font-bold mb-3 tracking-[0.1em] neon-shimmer">{cnt===16?tr(lang,'codemaster','MAÎTRE DES CODES'):tr(lang,'progress','PROGRESSION')}</h1>
      <div className="h-px bg-gradient-to-r from-transparent via-cyan-400 to-transparent w-32 mx-auto mb-4"></div>
      <p className="italic text-gray-400 mb-8">{cnt===16?tr(lang,'allSecretsRevealed','Tous les secrets ont été percés.'):cnt+(lang==='en'?' flag'+(cnt>1?'s':'')+' out of 16 collected':' flag'+(cnt>1?'s':'')+' sur 16 collecté'+(cnt>1?'s':''))+'.'}</p>
      <div className="glass rounded-xl border border-cyan-500/30 p-5 mb-6 text-left"><p className="ft text-xs uppercase tracking-[0.3em] text-cyan-400 mb-4 text-center">{tr(lang,"treasures","Trésors")} ({cnt}/16)</p><div className="space-y-2">{flags.map(i=>{const c=CH[i];return(<div key={c.id} className="flex items-center gap-3 bg-black/30 rounded-md p-2 border" style={{borderColor:c.clr+'30'}}><div className="w-10 h-10 rounded-full border flex items-center justify-center text-xl flex-shrink-0" style={{borderColor:c.clr+'60',color:c.clr}}>{c.ic}</div><div className="flex-1 min-w-0"><p className="text-xs ft tracking-wider" style={{color:c.clr}}>{c.ep}</p><p className="fm font-bold text-gray-200 tracking-wider truncate">{c.fl}</p></div></div>)})}{cnt<16&&<p className="text-center text-gray-600 italic text-sm mt-3">{16-cnt} {lang==='en'?(16-cnt>1?'puzzles remaining':'puzzle remaining'):('énigme'+(16-cnt>1?'s':'')+' restante'+(16-cnt>1?'s':''))}</p>}</div></div>
      <button onClick={()=>setV('home')} className="w-full py-4 bg-gradient-to-r from-cyan-600 to-blue-700 text-white rounded-xl ft font-bold uppercase tracking-widest active:scale-[0.98] shadow-lg shadow-cyan-500/30 border border-cyan-400/30">{cnt===16?tr(lang,'restart','Recommencer'):tr(lang,'continue','Continuer')}</button>
    </div></div></LangContext.Provider>
  );
  return null;
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
